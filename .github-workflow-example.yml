# Not wired up (the repo is local-only for now). Drop this at
# .github/workflows/ci.yml if it ever gets a remote.
name: ci
on: [push, pull_request]
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest pyyaml httpx
      - run: python -m pytest tests -q
      - run: cp .env.example .env && docker compose config --quiet
      - run: for s in install.sh kine scripts/*.sh; do bash -n "$s"; done

  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix: {image: [provision, helm]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
