services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:${PROWLARR_TAG}
    container_name: mc-prowlarr
    profiles: ["prowlarr"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${MC_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/prowlarr:/config
      # Single /data mount, not separate media and downloads mounts.
      # Anything else costs you hardlinks and atomic moves.
      - ${DATA_ROOT}:/data
    networks: [mc_internal, mc_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${MC_DOMAIN}`)
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696
