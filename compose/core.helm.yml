services:
  helm:
    build: ../helm
    image: kine/helm:local
    container_name: kine-helm
    restart: unless-stopped
    depends_on:
      dockerproxy:
        condition: service_started
    environment:
      TZ: ${KINE_TIMEZONE}
      KINE_ROOT: /stack
      KINE_REPO: /repo
      KINE_DOMAIN: ${KINE_DOMAIN}
      KINE_SECRET: ${KINE_SECRET}
      DOCKER_HOST: tcp://dockerproxy:2375
      HELM_SESSION_SECRET: ${HELM_SESSION_SECRET}
      HELM_ADMIN_USER: ${HELM_ADMIN_USER}
      HELM_ADMIN_HASH: ${HELM_ADMIN_HASH}
      HELM_UPDATE_CHECK_CRON: ${HELM_UPDATE_CHECK_CRON}
    volumes:
      # The repo itself: Helm edits .env and runs docker compose here.
      - ../:/repo
      - ${STACK_ROOT}:/stack
      # Compose validates env_file paths in this container before it
      # sends their host-absolute paths to Docker.
      - ${STACK_ROOT}:${STACK_ROOT}
    networks: [kine_edge, kine_internal, kine_ctrl]
    ports:
      # Bound directly as well as via Traefik, so the GUI stays
      # reachable if the reverse proxy is what you have broken.
      - "${HELM_BIND}:${HELM_PORT}:8600"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8600/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.helm.rule=Host(`admin.${KINE_DOMAIN}`)
      - traefik.http.services.helm.loadbalancer.server.port=8600

  dockerproxy:
    image: tecnativa/docker-socket-proxy:${SOCKETPROXY_TAG}
    container_name: kine-dockerproxy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      # Helm needs to inspect, start, stop and recreate containers.
      # Everything else stays shut.
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      POST: 1
      INFO: 1
      # Explicitly denied
      SECRETS: 0
      SWARM: 0
      NODES: 0
      SERVICES: 0
      CONFIGS: 0
      SYSTEM: 0
      PLUGINS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [kine_ctrl]
