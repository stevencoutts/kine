# Live TV apps share gluetun's network namespace so IPTV egress
# uses the VPN kill switch. No ports, networks, or Traefik labels
# here — those live on the gluetun service (port 9191).
#
# Do not pass PUID/PGID: remapping to a host nologin account breaks
# embedded Postgres init ("This account is currently not available").
services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:${DISPATCHARR_TAG}
    container_name: kine-dispatcharr
    profiles: ["dispatcharr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      TZ: ${KINE_TIMEZONE}
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    volumes:
      - ${STACK_ROOT}/config/dispatcharr:/data
      - ${DATA_ROOT}/media/recordings:/data/recordings
      - ../provision/assets/dispatcharr/kine-contrast.css:/app/static/kine-contrast.css:ro
      - ../provision/assets/dispatcharr/kine-contrast.nginx.conf:/etc/nginx/conf.d/kine-contrast.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
