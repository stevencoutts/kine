services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:${DISPATCHARR_TAG}
    container_name: kine-dispatcharr
    profiles: ["dispatcharr"]
    restart: unless-stopped
    # All-in-one mode (embedded Postgres + Redis). Do not pass PUID/PGID:
    # Dispatcharr remaps its user to those IDs, and host service accounts with
    # /usr/sbin/nologin (e.g. kine) make Postgres init fail with
    # "This account is currently not available".
    environment:
      TZ: ${KINE_TIMEZONE}
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
    volumes:
      - ${STACK_ROOT}/config/dispatcharr:/data
      - ${DATA_ROOT}/media/recordings:/data/recordings
    networks: [kine_internal, kine_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.http.routers.dispatcharr.rule=Host(`tv.${KINE_DOMAIN}`) || Host(`tv.${KINE_LOCAL_DOMAIN}`)
      - traefik.http.services.dispatcharr.loadbalancer.server.port=9191
