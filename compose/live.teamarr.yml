# Teamarr — tunnelled with Dispatcharr.
# Traefik router lives on gluetun (port 9195).
services:
  teamarr:
    image: ghcr.io/pharaoh-labs/teamarr:${TEAMARR_TAG}
    container_name: kine-teamarr
    profiles: ["teamarr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      dispatcharr:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      TZ: ${KINE_TIMEZONE}
      PUID: ${PUID}
      PGID: ${PGID}
      DISPATCHARR_URL: http://127.0.0.1:9191
    env_file:
      - ${STACK_ROOT}/config/teamarr/teamarr.env
    volumes:
      - ${STACK_ROOT}/config/teamarr:/app/data
