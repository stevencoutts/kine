# Generates per-team sports EPG and feeds the result to Dispatcharr.
services:
  teamarr:
    image: ghcr.io/pharaoh-labs/teamarr:${TEAMARR_TAG}
    container_name: kine-teamarr
    profiles: ["teamarr"]
    restart: unless-stopped
    depends_on:
      dispatcharr:
        condition: service_started
    environment:
      TZ: ${KINE_TIMEZONE}
      PUID: ${PUID}
      PGID: ${PGID}
      DISPATCHARR_URL: http://dispatcharr:9191
    env_file:
      - ${STACK_ROOT}/config/teamarr/teamarr.env
    volumes:
      - ${STACK_ROOT}/config/teamarr:/config
    networks: [kine_internal, kine_edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.teamarr.rule=Host(`sports.${KINE_DOMAIN}`) || Host(`sports.${KINE_LOCAL_DOMAIN}`)
      - traefik.http.services.teamarr.loadbalancer.server.port=8080
