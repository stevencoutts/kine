# Advertises the appliance and every enabled app's subdomain over mDNS
# (the .local TLD only -- that's the one clients actually resolve
# without configuration; see KINE_DOMAIN in .env.example). Needs the
# host's real network, not a container's, because mDNS is multicast on
# the LAN interface: hence network_mode: host instead of the usual
# kine_edge/kine_internal networks, and no ports block -- there's no
# separate namespace for one to belong to.
services:
  mdns:
    build: ../mdns
    image: kine/mdns:local
    container_name: kine-mdns
    profiles: ["mdns"]
    restart: unless-stopped
    network_mode: host
    environment:
      KINE_DOMAIN: ${KINE_DOMAIN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      MDNS_HOST_IP: ${MDNS_HOST_IP:-}
    volumes:
      - ../catalogue.yml:/catalogue.yml:ro
