# Recyclarr needs GitHub for TRaSH Guides and only talks to Sonarr/Radarr
# over HTTP. It stays on kine_internal (not inside gluetun) so profile sync
# still works when the VPN tunnel is down or DNS inside the namespace fails.
services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:${RECYCLARR_TAG}
    container_name: kine-recyclarr
    profiles: ["recyclarr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    networks: [kine_internal]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${KINE_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/recyclarr:/config
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/recyclarr.yml && test -f /config/secrets.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
