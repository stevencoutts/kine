services:
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:${RECYCLARR_TAG}
    container_name: mc-recyclarr
    profiles: ["recyclarr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${MC_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/recyclarr:/config
