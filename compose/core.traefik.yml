services:
  traefik:
    image: traefik:${TRAEFIK_TAG}
    container_name: kine-traefik
    restart: unless-stopped
    depends_on:
      dockerproxy:
        condition: service_started
    security_opt: [no-new-privileges:true]
    # Append ACME DNS-01 flags from acme-args.txt when KINE_TLS_MODE=acme-dns.
    entrypoint: ["/bin/sh", "/traefik-entrypoint.sh"]
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://dockerproxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=kine_edge
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:${TRAEFIK_HTTP_PORT:-8080}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_PORT:-8443}
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
      - --ping=true
    # ClouDNS / other ACME DNS provider credentials (created by tls-setup.sh).
    env_file:
      - ${STACK_ROOT}/config/traefik/acme.env
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:${TRAEFIK_HTTP_PORT:-8080}"
      - "${TRAEFIK_HTTPS_PORT:-8443}:${TRAEFIK_HTTPS_PORT:-8443}"
    volumes:
      - ${STACK_ROOT}/config/traefik:/etc/traefik
      - ../scripts/traefik-entrypoint.sh:/traefik-entrypoint.sh:ro
    networks: [kine_edge, kine_ctrl]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${KINE_DOMAIN}`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=kine-auth@file
