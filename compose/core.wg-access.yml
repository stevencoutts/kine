# Client VPN (WireGuard). It does not join gluetun and it does not depend on it.
# Turning this on must not recreate the tunnel the rest of Kine is using.
# The profile stays out of COMPOSE_PROFILES; Helm starts this service by name.
#
# No build section. Helm reaches Docker through the socket proxy, which
# rejects the build API, so `compose up` must not build this image.
# Build it on the host (the real docker socket) after wg-access/ or
# client_vpn.py changes:
#   docker build -f wg-access/Dockerfile -t kine/wg-access:local .
services:
  wg-access:
    image: kine/wg-access:local
    pull_policy: never
    container_name: kine-wg-access
    profiles: ["wg-access"]
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_ADMIN]
    # Host PIDs so the relay can enter gluetun's network namespace.
    # It signals only its own sing-box processes, never gluetun's init.
    # The host's routes are read from /proc/1/net/route through it too.
    pid: host
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      TZ: ${KINE_TIMEZONE}
      KINE_LAN_IP: ${KINE_LAN_IP:-}
    volumes:
      - ${STACK_ROOT}/config/wg-access:/config
      # Internal-zone DNS goes to the host's private nameserver.
      - /etc/resolv.conf:/host/resolv.conf:ro
    networks: [kine_edge, kine_internal]
    ports:
      - "${WG_ACCESS_PORT:-51820}:51820/udp"
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,sys; sys.exit(0 if pathlib.Path('/config/status.json').is_file() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
