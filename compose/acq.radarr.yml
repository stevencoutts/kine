services:
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG}
    container_name: mc-radarr
    profiles: ["radarr"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${MC_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/radarr:/config
      # Single /data mount, not separate media and downloads mounts.
      # Anything else costs you hardlinks and atomic moves.
      - ${DATA_ROOT}:/data
    networks: [mc_internal, mc_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${MC_DOMAIN}`)
      - traefik.http.services.radarr.loadbalancer.server.port=7878
