# Tunnelled. Every tier 2 application runs inside gluetun's network
# namespace, so this fragment carries no ports, no networks and no
# Traefik labels: all three live on the gluetun service.
#
# Inside the namespace these apps address each other as 127.0.0.1,
# because they genuinely share one loopback.
services:
  radarr:
    image: lscr.io/linuxserver/radarr:${RADARR_TAG}
    container_name: kine-radarr
    profiles: ["radarr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${KINE_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/radarr:/config
      - ${DATA_ROOT}/media:/data/media
      - ${DATA_ROOT}/downloads:/data/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
