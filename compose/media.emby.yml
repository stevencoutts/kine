services:
  emby:
    image: emby/embyserver:${EMBY_TAG}
    container_name: kine-emby
    profiles: ["emby"]
    restart: unless-stopped
    environment:
      UID: ${PUID}
      GID: ${PGID}
      GIDLIST: ${PGID},${RENDER_GID}
      TZ: ${KINE_TIMEZONE}
    devices:
      # Intel QuickSync. install.sh detects the host render GID and
      # writes it to RENDER_GID; hardcoding it breaks across distros.
      - /dev/dri:/dev/dri
    volumes:
      - ${STACK_ROOT}/config/emby:/config
      # Media read-only: Emby has no business writing to the library.
      - ${DATA_ROOT}/media:/data/media:ro
    networks: [kine_internal, kine_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8096/System/Info/Public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.emby.rule=Host(`emby.${KINE_DOMAIN}`)
      - traefik.http.services.emby.loadbalancer.server.port=8096
