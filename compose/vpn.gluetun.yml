# gluetun owns a network namespace. Every tier 2 (acquisition)
# application joins it with network_mode: service:gluetun, so none of
# them has an interface of its own and none has a path to the internet
# except wg0. gluetun's firewall drops everything else, which is what
# makes this a kill switch rather than a routing preference.
#
# Four consequences, all handled here:
#
#   1. Tunnelled apps carry no ports, no networks and no Traefik
#      labels. Every router for them hangs off this service, because
#      this service is where their ports actually live.
#   2. Inside the namespace they share one loopback, so they address
#      each other as 127.0.0.1. From outside, on mc_internal, they are
#      reached as gluetun:<port>.
#   3. Their published ports must not collide, because they are all the
#      same network stack. The assignments below are the whole set.
#   4. Restarting gluetun severs every one of them. The tunnel group
#      restarts together or not at all: `./mc vpn restart`, and the GUI
#      refuses to restart gluetun on its own.
#
# The trade-off, stated plainly: with the whole acquisition tier inside
# the tunnel, a VPN outage takes Sonarr, Radarr and Prowlarr offline
# alongside the download clients. That is the correct behaviour for a
# kill switch, but it does mean the tunnel is now a hard dependency for
# far more than torrenting, and a flapping VPN looks like a broken
# *arr stack. The GUI's VPN page exists partly to make that obvious.

services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_TAG}
    container_name: mc-gluetun
    profiles: ["gluetun"]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${MC_TIMEZONE}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      VPN_PORT_FORWARDING_PROVIDER: ${VPN_PORT_FORWARDING_PROVIDER}
      # Must include the Docker bridge subnets, or Traefik cannot reach
      # back into the namespace and the provisioner cannot configure it.
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS}
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      DOT: "off"
    volumes:
      - ${STACK_ROOT}/config/gluetun:/gluetun
    networks: [mc_internal, mc_edge]
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      # ── Every tier 2 app's router lives here ──────────────────
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${MC_DOMAIN}`)
      - traefik.http.routers.sonarr.service=sonarr
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

      - traefik.http.routers.radarr.rule=Host(`radarr.${MC_DOMAIN}`)
      - traefik.http.routers.radarr.service=radarr
      - traefik.http.services.radarr.loadbalancer.server.port=7878

      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${MC_DOMAIN}`)
      - traefik.http.routers.prowlarr.service=prowlarr
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

      - traefik.http.routers.bazarr.rule=Host(`bazarr.${MC_DOMAIN}`)
      - traefik.http.routers.bazarr.service=bazarr
      - traefik.http.services.bazarr.loadbalancer.server.port=6767

      - traefik.http.routers.transmission.rule=Host(`transmission.${MC_DOMAIN}`)
      - traefik.http.routers.transmission.service=transmission
      - traefik.http.services.transmission.loadbalancer.server.port=9091

      - traefik.http.routers.nzbget.rule=Host(`nzbget.${MC_DOMAIN}`)
      - traefik.http.routers.nzbget.service=nzbget
      - traefik.http.services.nzbget.loadbalancer.server.port=6789

  # Keeps Transmission's listening port in step with the port Proton
  # forwards, which rotates. Without this you get no incoming peers.
  vpn-portsync:
    image: alpine:${ALPINE_TAG}
    container_name: mc-vpn-portsync
    profiles: ["gluetun"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      TRANSMISSION_RPC: http://127.0.0.1:9091/transmission/rpc
    volumes:
      - ./scripts/vpn-portsync.sh:/portsync.sh:ro
    entrypoint: ["/bin/sh", "/portsync.sh"]
