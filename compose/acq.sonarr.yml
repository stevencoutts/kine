# Tunnelled. Every tier 2 application runs inside gluetun's network
# namespace, so this fragment carries no ports, no networks and no
# Traefik labels: all three live on the gluetun service.
#
# Inside the namespace these apps address each other as 127.0.0.1,
# because they genuinely share one loopback.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:${SONARR_TAG}
    container_name: kine-sonarr
    profiles: ["sonarr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${KINE_TIMEZONE}
    volumes:
      - ${STACK_ROOT}/config/sonarr:/config
      # Single /data mount, not separate media and downloads mounts.
      # Anything else costs you hardlinks and atomic moves.
      - ${DATA_ROOT}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
