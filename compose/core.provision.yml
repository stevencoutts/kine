services:
  provision:
    build: ../provision
    image: kine/provision:local
    container_name: kine-provision
    # Runs to completion then exits. Re-run on demand:
    #   ./kine provision            (idempotent, safe to repeat)
    restart: "no"
    environment:
      TZ: ${KINE_TIMEZONE}
      KINE_TIMEZONE: ${KINE_TIMEZONE}
      KINE_SECRET: ${KINE_SECRET}
      KINE_DOMAIN: ${KINE_DOMAIN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      VPN_TUNNELLED_APPS: ${VPN_TUNNELLED_APPS}
      PUID: ${PUID}
      PGID: ${PGID}
      PLEX_HOST: ${PLEX_HOST:-}
      PLEX_PORT: ${PLEX_PORT:-32400}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_USE_SSL: ${PLEX_USE_SSL:-false}
      EMBY_HOST: ${EMBY_HOST:-}
      EMBY_PORT: ${EMBY_PORT:-8096}
      EMBY_API_KEY: ${EMBY_API_KEY:-}
      EMBY_USE_SSL: ${EMBY_USE_SSL:-false}
      DISPATCHARR_TOKEN: ${DISPATCHARR_TOKEN:-}
      DISPATCHARR_LOGIN_USER: ${DISPATCHARR_LOGIN_USER:-kine}
      DISPATCHARR_LOGIN_PASSWORD: ${DISPATCHARR_LOGIN_PASSWORD:-}
      GAME_THUMBS_PUBLIC_URL: ${GAME_THUMBS_PUBLIC_URL:-}
      TRAEFIK_HTTPS_PORT: ${TRAEFIK_HTTPS_PORT:-443}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
      NZBGET_NEWS_SERVERS: ${NZBGET_NEWS_SERVERS:-}
    volumes:
      - ${STACK_ROOT}:/stack
      - ${DATA_ROOT}/media:/data/media
      - ${DATA_ROOT}/downloads:/data/downloads
    networks: [kine_internal]
