services:
  unpackerr:
    image: golift/unpackerr:${UNPACKERR_TAG}
    container_name: mc-unpackerr
    profiles: ["unpackerr"]
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${MC_TIMEZONE}
      UN_SONARR_0_URL: http://localhost:8989
      UN_SONARR_0_PATHS_0: /data/downloads
      UN_RADARR_0_URL: http://localhost:7878
      UN_RADARR_0_PATHS_0: /data/downloads
    env_file:
      - ${STACK_ROOT}/config/unpackerr/unpackerr.env
    volumes:
      - ${DATA_ROOT}/downloads:/data/downloads
