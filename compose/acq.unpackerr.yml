services:
  unpackerr:
    image: golift/unpackerr:${UNPACKERR_TAG}
    container_name: mc-unpackerr
    profiles: ["unpackerr"]
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${MC_TIMEZONE}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_PATHS_0: /data/downloads
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_PATHS_0: /data/downloads
      # API keys are injected by the provisioner into
      # ${STACK_ROOT}/config/unpackerr/unpackerr.env
    env_file:
      - ${STACK_ROOT}/config/unpackerr/unpackerr.env
    volumes:
      - ${DATA_ROOT}/downloads:/data/downloads
    networks: [mc_internal]
