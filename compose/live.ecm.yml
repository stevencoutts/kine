# Enhanced Channel Manager: a channel-management front end for
# Dispatcharr. Pointless without it, so the profile is gated in
# catalogue.yml on dispatcharr being enabled.
services:
  ecm:
    image: ghcr.io/motwakorb/enhancedchannelmanager:${ECM_TAG}
    container_name: mc-ecm
    profiles: ["ecm"]
    restart: unless-stopped
    depends_on:
      dispatcharr:
        condition: service_started
    environment:
      TZ: ${MC_TIMEZONE}
      PUID: ${PUID}
      PGID: ${PGID}
      DISPATCHARR_URL: http://dispatcharr:9191
    env_file:
      - ${STACK_ROOT}/config/ecm/ecm.env
    volumes:
      - ${STACK_ROOT}/config/ecm:/config
    networks: [mc_internal, mc_edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ecm.rule=Host(`channels.${MC_DOMAIN}`)
      - traefik.http.services.ecm.loadbalancer.server.port=8080
