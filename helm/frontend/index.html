<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kine</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#18191b; --panel:#242628; --panel-2:#2e3134; --line:#3e4248;
  --text:#eef0f2; --muted:#9aa0a8; --accent:#8a8f98; --accent-strong:#c4c8ce;
  --ok:#3fb950; --warn:#e0a030; --bad:#f85149; --radius:16px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#eceef0;--panel:#fff;--panel-2:#f4f5f6;--line:#d5d8dc;
        --text:#1c1e21;--muted:#6b7280;--accent:#6b7280;--accent-strong:#374151;}
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
     font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
     background:
       radial-gradient(1100px 500px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent),
       radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent),
       var(--bg);
     background-attachment:fixed}
header{display:flex;align-items:center;gap:.85rem;padding:1rem 1.5rem;
       border-bottom:1px solid var(--line);
       background:color-mix(in srgb, var(--panel) 65%, transparent);
       backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:.65rem}
.brand-mark{width:28px;height:28px;flex:none;display:block}
header h1{font-size:1.05rem;margin:0;letter-spacing:.04em;font-weight:600;
  color:var(--accent-strong)}
nav{display:flex;gap:.25rem;margin-left:auto}
nav button{background:color-mix(in srgb, var(--panel) 50%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid color-mix(in srgb, var(--line) 60%, transparent);
  color:var(--muted);padding:.5rem 1rem;border-radius:999px;cursor:pointer;font-size:.9rem}
nav button.active{background:color-mix(in srgb, var(--accent) 85%, transparent);
  color:#fff;border-color:color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow:0 2px 12px color-mix(in srgb, var(--accent) 25%, transparent)}
nav button.nav-logout{margin-left:.35rem;opacity:.85}
nav button.nav-logout:hover{color:var(--text);border-color:var(--line);opacity:1}
main{padding:1.5rem;padding-bottom:4rem;max-width:1100px;margin:0 auto}
footer#vpnbar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;align-items:center;gap:.5rem;padding:.6rem 1.5rem;
  background:color-mix(in srgb, var(--panel) 70%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
footer#vpnbar b{color:var(--text)}
footer#vpnbar .dot.on{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:color-mix(in srgb, var(--panel) 52%, transparent);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
      border-radius:var(--radius);box-shadow:0 4px 24px color-mix(in srgb, #000 6%, transparent);
      padding:1.1rem;display:flex;flex-direction:column;gap:.5rem}
.card h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.card p{margin:0;color:var(--muted);font-size:.85rem;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--line)}
.row{display:flex;gap:.5rem;align-items:center}
button.act{background:color-mix(in srgb, var(--panel-2) 65%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  color:var(--text);padding:.4rem .85rem;border-radius:999px;cursor:pointer;font-size:.8rem}
button.act:hover{border-color:var(--accent-strong)}
button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.act.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#18191b}
a.link{color:var(--accent-strong);text-decoration:none;font-size:.8rem}
pre{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:.75rem;overflow:auto;font-size:.8rem;max-height:420px}
.section{margin-bottom:2rem}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:0 0 .75rem}
.overview-bar{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem}
.overview-btn{flex:1;min-width:150px;position:relative;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;align-items:stretch;
  background:color-mix(in srgb, var(--panel) 48%, transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid color-mix(in srgb, var(--line) 50%, transparent);
  border-radius:var(--radius);padding:.85rem 1rem 1rem;
  box-shadow:0 4px 20px color-mix(in srgb, #000 5%, transparent);
  transition:border-color .15s,box-shadow .15s,background .15s}
.overview-btn:hover{border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.overview-btn.active{border-color:color-mix(in srgb, var(--accent) 65%, transparent);
  background:color-mix(in srgb, var(--accent) 14%, transparent);
  box-shadow:0 6px 28px color-mix(in srgb, var(--accent) 18%, transparent)}
.overview-btn.off-tier{opacity:.72}
.overview-btn.watching-live,
.overview-btn.downloads-live{
  border-color:color-mix(in srgb, var(--ok) 55%, transparent);
  background:color-mix(in srgb, var(--ok) 16%, transparent);
  box-shadow:0 4px 20px color-mix(in srgb, var(--ok) 18%, transparent)}
.overview-btn.watching-live.active,
.overview-btn.downloads-live.active{
  border-color:color-mix(in srgb, var(--ok) 70%, transparent);
  background:color-mix(in srgb, var(--ok) 22%, transparent);
  box-shadow:0 6px 28px color-mix(in srgb, var(--ok) 22%, transparent)}
.overview-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin-bottom:.45rem;min-height:1.35rem}
/* The global label margin would make toggle-bearing cards taller than Watching. */
.overview-top .tier-switch{margin:0}
.overview-btn h2{margin:0;font-size:.72rem;line-height:1.35rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left}
.overview-stat{font-size:1.15rem;font-weight:600;line-height:1.2}
.overview-stat span{color:var(--muted);font-weight:400;font-size:.82rem}
.settings-nav{display:flex;flex-wrap:wrap;gap:.55rem;margin:0 0 1.15rem}
.settings-nav-btn{appearance:none;cursor:pointer;font:inherit;text-align:left;
  padding:.7rem .95rem;border-radius:var(--radius);
  color:var(--muted);background:color-mix(in srgb, var(--panel) 55%, transparent);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid color-mix(in srgb, var(--line) 50%, transparent);
  box-shadow:0 4px 18px color-mix(in srgb, #000 5%, transparent);
  transition:border-color .18s,background .18s,color .18s}
.settings-nav-btn:hover{border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:var(--text)}
.settings-nav-btn.active{color:var(--text);
  border-color:color-mix(in srgb, var(--accent) 65%, transparent);
  background:color-mix(in srgb, var(--accent) 10%, var(--panel));
  box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),
    0 6px 22px color-mix(in srgb, #000 6%, transparent)}
.settings-nav-btn .settings-nav-label{display:block;font-size:.72rem;line-height:1.2;
  text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.settings-panel[hidden]{display:none!important}
.settings-panel > .card{margin:0}
.watch-list{display:flex;flex-direction:column;gap:.85rem}
.watch-row{padding:.15rem 0}
.watch-row strong{display:block;font-size:.95rem}
.watch-row .watch-sub{color:var(--muted);font-size:.8rem}
.watch-bar{height:4px;margin-top:.45rem;border-radius:999px;
  background:color-mix(in srgb, var(--line) 70%, transparent);overflow:hidden}
.watch-bar i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.watch-cards{display:flex;flex-direction:column;gap:.9rem}
.watch-card{position:relative;overflow:hidden;padding:0;
  border-radius:14px;border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  background:
    linear-gradient(135deg,
      color-mix(in srgb, var(--panel) 92%, transparent),
      color-mix(in srgb, var(--panel-2) 70%, transparent));
  box-shadow:0 10px 28px color-mix(in srgb, #000 6%, transparent)}
.watch-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;z-index:2;
  background:var(--watch-accent, var(--ok))}
.watch-card.plex{--watch-accent:#e5a00d}
.watch-card.emby{--watch-accent:#52b54b}
.watch-card.paused{opacity:.88}
.watch-card-body{display:flex;align-items:stretch;gap:0;min-height:148px}
.watch-art{flex:none;width:168px;position:relative;overflow:hidden;
  background:#12151c;border:0;border-radius:0;box-shadow:none;
  display:flex;align-items:center;justify-content:center}
.watch-art img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.watch-art.channel{background:#0c0e14}
.watch-art.channel img{object-fit:contain;padding:16%;box-sizing:border-box;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.watch-art-fallback{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  padding:.5rem;box-sizing:border-box;
  color:color-mix(in srgb, var(--watch-accent, #9aa3b2) 55%, #9aa3b2);
  font-weight:750;letter-spacing:.02em;text-transform:uppercase;user-select:none;
  background:linear-gradient(160deg,#1a1e28,#0f1218)}
/* class display:flex must not defeat the HTML hidden attribute */
.watch-art-fallback[hidden]{display:none!important}
.watch-art-fallback .mono{font-size:1.35rem;line-height:1.1;text-align:center;
  word-break:break-all;max-width:100%}
.watch-card-main{flex:1;min-width:0;padding:1rem 1.1rem 1.05rem}
.watch-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.watch-card-title{margin:0;font-size:1.05rem;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.watch-card-show{margin:.2rem 0 0;color:var(--muted);font-size:.8rem}
.watch-badges{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:flex-end}
.watch-badge{display:inline-flex;align-items:center;gap:.25rem;padding:.22rem .62rem;
  border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid transparent}
.watch-badge.plex{background:rgba(229,160,13,.14);color:#b87a00;border-color:rgba(229,160,13,.28)}
.watch-badge.emby{background:rgba(82,181,75,.14);color:#2f7a2c;border-color:rgba(82,181,75,.28)}
.watch-badge.state{background:color-mix(in srgb, var(--ok) 14%, transparent);color:var(--ok);
  border-color:color-mix(in srgb, var(--ok) 28%, transparent)}
.watch-badge.state.paused{background:rgba(224,160,48,.14);color:var(--warn);
  border-color:rgba(224,160,48,.28)}
.watch-badge.kind{background:color-mix(in srgb, var(--panel-2) 80%, transparent);color:var(--muted);
  border-color:color-mix(in srgb, var(--line) 70%, transparent)}
.watch-badge.format-res{background:color-mix(in srgb, var(--panel-2) 78%, transparent);color:var(--text);
  border-color:color-mix(in srgb, var(--line) 70%, transparent)}
.watch-badge.format-video{background:rgba(59,130,246,.14);color:#1d5bbf;border-color:rgba(59,130,246,.28)}
.watch-badge.format-audio{background:rgba(13,148,136,.12);color:#0f766e;border-color:rgba(13,148,136,.28)}
.watch-badge.format-bitrate{background:color-mix(in srgb, var(--panel-2) 78%, transparent);color:var(--muted);
  border-color:color-mix(in srgb, var(--line) 70%, transparent)}
.watch-badge.stream{background:color-mix(in srgb, var(--ok) 12%, transparent);color:var(--ok);
  border-color:color-mix(in srgb, var(--ok) 26%, transparent)}
.watch-badge.stream.transcode{background:rgba(224,160,48,.14);color:var(--warn);
  border-color:rgba(224,160,48,.28)}
.watch-meta{display:flex;flex-wrap:wrap;gap:.4rem .7rem;margin-top:.75rem;color:var(--muted);font-size:.8rem}
.watch-meta span{display:inline-flex;align-items:center;gap:.3rem}
.watch-meta b{color:var(--text);font-weight:600}
.watch-formats{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
.watch-source{margin-top:.65rem;padding:.45rem .6rem;border-radius:8px;font-size:.75rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
  background:color-mix(in srgb, var(--panel-2) 75%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.watch-progress{margin-top:.85rem}
.watch-progress-top{display:flex;justify-content:space-between;gap:.75rem;margin-bottom:.35rem;
  font-size:.75rem;color:var(--muted)}
.watch-progress-top strong{color:var(--text);font-weight:650}
.watch-progress .watch-bar{height:7px;margin-top:0}
.watch-progress .watch-bar i{
  background:linear-gradient(90deg, color-mix(in srgb, var(--watch-accent, var(--ok)) 70%, #fff),
    var(--watch-accent, var(--ok)))}
@media (max-width:560px){
  .watch-art{width:120px}
  .watch-card-title{font-size:.98rem}
  .watch-card-main{padding:.9rem .85rem .9rem}
}
.dl-cards{display:flex;flex-direction:column;gap:.9rem}
.dl-card{position:relative;overflow:hidden;padding:1rem 1.05rem 1.05rem;
  border-radius:14px;border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  background:
    linear-gradient(135deg,
      color-mix(in srgb, var(--panel) 92%, transparent),
      color-mix(in srgb, var(--panel-2) 70%, transparent));
  box-shadow:0 10px 28px color-mix(in srgb, #000 6%, transparent)}
.dl-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;
  background:var(--dl-accent, var(--ok))}
.dl-card.transmission{--dl-accent:#e5a00d}
.dl-card.nzbget{--dl-accent:#3b82f6}
.dl-card.paused,.dl-card.queued{opacity:.9}
.watch-badge.transmission{background:rgba(229,160,13,.14);color:#b87a00;border-color:rgba(229,160,13,.28)}
.watch-badge.nzbget{background:rgba(59,130,246,.14);color:#1d5bbf;border-color:rgba(59,130,246,.28)}
.dl-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.dl-card-title{margin:0;font-size:1rem;line-height:1.35;font-weight:650;letter-spacing:-.01em;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dl-summary{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.85rem}
.dl-summary-card{flex:1;min-width:180px;padding:.7rem .85rem;border-radius:12px;
  border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  background:color-mix(in srgb, var(--panel-2) 55%, transparent)}
.dl-summary-card strong{display:block;font-size:.85rem;margin-bottom:.2rem}
.dl-summary-card span{color:var(--muted);font-size:.78rem}
.dl-summary-card.warn span{color:var(--warn)}
.vpn-cards{display:flex;flex-direction:column;gap:.9rem}
.vpn-card{position:relative;overflow:hidden;padding:1rem 1.05rem 1.05rem;
  border-radius:14px;border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
  background:
    linear-gradient(135deg,
      color-mix(in srgb, var(--panel) 92%, transparent),
      color-mix(in srgb, var(--panel-2) 70%, transparent));
  box-shadow:0 10px 28px color-mix(in srgb, #000 6%, transparent)}
.vpn-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;
  background:var(--vpn-accent, var(--ok))}
.vpn-card.active-hero{--vpn-accent:var(--ok)}
.vpn-card.off{--vpn-accent:var(--muted);opacity:.92}
.vpn-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.vpn-card-title{margin:0;font-size:1.05rem;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.vpn-card-actions{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.85rem}
.watch-badge.vpn-wg{background:rgba(59,130,246,.14);color:#1d5bbf;border-color:rgba(59,130,246,.28)}
.watch-badge.vpn-ovpn{background:color-mix(in srgb, var(--panel-2) 80%, transparent);color:var(--muted);
  border-color:color-mix(in srgb, var(--line) 70%, transparent);opacity:.75}
.watch-badge.vpn-active{background:color-mix(in srgb, var(--ok) 14%, transparent);color:var(--ok);
  border-color:color-mix(in srgb, var(--ok) 28%, transparent)}
.vpn-tunnelled{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
.vpn-tunnelled span{font-size:.72rem;padding:.18rem .5rem;border-radius:999px;
  background:color-mix(in srgb, var(--panel-2) 75%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 55%, transparent);color:var(--muted)}
.vpn-profiles-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  margin:0 0 .75rem}
.vpn-profiles-head h3{margin:0;font-size:.95rem}
.vpn-modal label{display:block;margin:.65rem 0 .3rem;font-size:.8rem;color:var(--muted)}
.vpn-modal input,.vpn-modal textarea{width:100%;box-sizing:border-box}
.vpn-modal textarea{min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.78rem;line-height:1.4}
.vpn-modal .err{color:var(--bad);font-size:.8rem;margin:.5rem 0 0;min-height:1.1rem}
.dispatch-source{border:1px solid var(--line);border-radius:10px;padding:.85rem 1rem;margin:.65rem 0;
  background:color-mix(in srgb, var(--panel-2) 65%, transparent)}
.dispatch-source-top{display:flex;justify-content:space-between;gap:.75rem;align-items:flex-start}
.dispatch-source-title{margin:0;font-size:.92rem;font-weight:650}
.dispatch-source-meta{font-size:.78rem;color:var(--muted);margin-top:.25rem;word-break:break-all}
.dispatch-source-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.65rem}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.75rem}
.panel-grid iframe{width:100%;height:210px;border:0;border-radius:10px;
  background:color-mix(in srgb, var(--panel) 60%, transparent)}
.panel-grid iframe.tall{grid-column:span 2;height:260px}
@media (max-width:760px){.panel-grid iframe.tall{grid-column:span 1}}
.embed-overlay{position:fixed;inset:0;z-index:40;display:none;
  flex-direction:column;background:var(--bg)}
.embed-overlay.open{display:flex}
.embed-bar{display:flex;align-items:center;gap:.6rem;padding:.55rem .85rem;
  border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.embed-bar h2{margin:0;font-size:.95rem;flex:1;min-width:0;
  padding-inline:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.embed-overlay iframe{flex:1;width:100%;border:0;background:#0b0c0f}
.tier-switch{position:relative;display:inline-flex;align-items:center;flex:none;cursor:pointer}
.tier-switch input{position:absolute;opacity:0;width:0;height:0;margin:0}
.tier-switch-ui{display:inline-flex;align-items:center;width:2.6rem;height:1.35rem;
  border-radius:999px;padding:2px;
  background:color-mix(in srgb, var(--panel-2) 70%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  box-shadow:inset 0 1px 3px color-mix(in srgb, #000 12%, transparent);
  transition:background .18s,border-color .18s,box-shadow .18s}
.tier-switch-ui::before{content:"";width:1.05rem;height:1.05rem;border-radius:50%;
  background:color-mix(in srgb, var(--panel) 90%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 50%, transparent);
  box-shadow:0 1px 4px color-mix(in srgb, #000 18%, transparent);
  transition:transform .18s,background .18s,border-color .18s}
.tier-switch input:checked + .tier-switch-ui{
  background:color-mix(in srgb, var(--ok) 55%, transparent);
  border-color:color-mix(in srgb, var(--ok) 45%, transparent);
  box-shadow:0 0 12px color-mix(in srgb, var(--ok) 28%, transparent),
    inset 0 1px 2px color-mix(in srgb, #fff 12%, transparent)}
.tier-switch input:checked + .tier-switch-ui::before{
  transform:translateX(1.2rem);
  background:#fff;border-color:transparent}
.tier-switch input:focus-visible + .tier-switch-ui{
  outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent);outline-offset:2px}
.tier-switch input:disabled + .tier-switch-ui{opacity:.55;cursor:wait}
.tier-switch.settings-configured input:disabled + .tier-switch-ui{opacity:1;cursor:default}
.tier-switch.settings-configured input:checked:disabled + .tier-switch-ui{
  background:color-mix(in srgb, var(--ok) 55%, transparent);
  border-color:color-mix(in srgb, var(--ok) 45%, transparent);
  box-shadow:0 0 12px color-mix(in srgb, var(--ok) 28%, transparent),
    inset 0 1px 2px color-mix(in srgb, #fff 12%, transparent)}
.tier-switch > span:not(.tier-switch-ui){user-select:none}
.apps-panel{background:color-mix(in srgb, var(--panel) 38%, transparent);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid color-mix(in srgb, var(--line) 45%, transparent);
  border-radius:var(--radius);padding:1.25rem;
  box-shadow:0 8px 32px color-mix(in srgb, #000 7%, transparent)}
.apps-section{margin-top:1.1rem}
.apps-section:first-child{margin-top:0}
.apps-section-title{margin:0 0 .75rem;font-size:.72rem;font-weight:650;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.apps-section + .apps-section{padding-top:1.1rem;
  border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent)}
label{display:block;font-size:.8rem;color:var(--muted);margin:.75rem 0 .25rem}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);padding:.5rem;border-radius:6px;font:inherit}
textarea{font-family:ui-monospace,monospace;font-size:.8rem;resize:vertical}
.login{max-width:340px;margin:12vh auto}
.banner{padding:.6rem .9rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.banner.ok{background:rgba(63,185,80,.12);border:1px solid var(--ok)}
.banner.bad{background:rgba(248,81,73,.12);border:1px solid var(--bad)}
.nfs-role-row{display:grid;grid-template-columns:9rem 1fr;gap:.5rem .75rem;
  align-items:center;margin:.35rem 0}
.nfs-role-row label{margin:0}
.nfs-shares{margin:.75rem 0;padding:.75rem;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--panel-2)}
.nfs-shares p{margin:0 0 .5rem;color:var(--muted);font-size:.8rem}
.nfs-shares ul{margin:0;padding:0;list-style:none;font-size:.8rem}
.nfs-shares li{padding:.2rem 0;color:var(--text);word-break:break-all}
.nfs-shares li span{color:var(--muted)}
.updates-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem}
.updates-table th,.updates-table td{padding:.55rem .65rem;text-align:left;border-bottom:1px solid var(--line)}
.updates-table th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.updates-table tr:last-child td{border-bottom:none}
.updates-table td.mono{font-family:ui-monospace,monospace;font-size:.78rem}
.updates-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
  background:color-mix(in srgb, var(--panel) 52%, transparent)}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600}
.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.badge.warn{background:rgba(224,160,48,.15);color:var(--warn)}
.badge.bad{background:rgba(248,81,73,.15);color:var(--bad)}
.badge.busy{background:rgba(100,149,237,.15);color:#7eb6ff}
.badge.muted{background:color-mix(in srgb, var(--panel-2) 80%, transparent);color:var(--muted)}
.badge.dev{background:rgba(100,149,237,.15);color:#7eb6ff}
@media (prefers-color-scheme: light){.badge.dev,.badge.busy{color:#2563eb}}
#updates-progress{position:sticky;top:.5rem;z-index:2;margin-bottom:.75rem}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
  display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:1.1rem 1.25rem;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal h3{margin:0 0 .5rem}
.modal p{color:var(--muted);font-size:.85rem;margin:0 0 .85rem}
.nzb-server{border:1px solid var(--line);border-radius:8px;padding:.75rem;margin-bottom:.65rem;
  background:color-mix(in srgb, var(--panel-2) 70%, transparent)}
.nzb-server .row{gap:.5rem;flex-wrap:wrap}
.nzb-server label{font-size:.75rem;margin-top:.35rem}
.nzb-server input[type=checkbox]{width:auto}
.teamarr-league-row{display:flex;align-items:center;gap:.6rem;margin:.4rem 0;
  color:var(--text);font-size:.88rem;cursor:pointer}
.teamarr-league-row input[type=checkbox]{width:auto;flex:none;margin:0;accent-color:var(--accent)}
.teamarr-league-row span{flex:1;min-width:0;line-height:1.35}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = async (path, opts={}) => {
  const r = await fetch('/api'+path, {credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, ...opts});
  if (r.status === 401) { render.login(); throw new Error('Unauthenticated'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || 'Request failed');
  return data;
};

const state = { tab:'apps', apps:[], tiers:{}, activeTier:null, watchTimer:null,
  updatesLog:'', updatesProgress:null, settingsSection:'appliance' };
const SETTINGS_SECTIONS = [
  {id:'appliance', label:'Appliance'},
  {id:'storage', label:'Storage'},
  {id:'media-servers', label:'Media Servers'},
  {id:'live-tv', label:'Live TV'},
  {id:'subtitles', label:'Subtitles'},
  {id:'nzbget', label:'NZBGet'},
];
const escHtml = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const TAB_LABELS = {apps:'Apps', stats:'Stats', updates:'Updates', vpn:'VPN', status:'Status', settings:'Settings'};

const emptyNzbServer = () => ({
  name: '', host: '', port: 563, username: '', password: '',
  encryption: true, connections: 8,
});

const collectNzbServers = (root=document) => {
  const rows = [...root.querySelectorAll('[data-nzb-server]')];
  return rows.map((el, i) => {
    const enc = !!$('[data-nzb-enc]', el)?.checked;
    const portRaw = $('[data-nzb-port]', el)?.value.trim();
    const connRaw = $('[data-nzb-conn]', el)?.value.trim();
    return {
      name: $('[data-nzb-name]', el)?.value.trim() || `Server ${i + 1}`,
      host: $('[data-nzb-host]', el)?.value.trim() || '',
      port: portRaw ? Number(portRaw) : (enc ? 563 : 119),
      username: $('[data-nzb-user]', el)?.value || '',
      password: $('[data-nzb-pass]', el)?.value || '',
      encryption: enc,
      connections: connRaw ? Number(connRaw) : 8,
    };
  }).filter(s => s.host);
};

const nzbServerRowHtml = (s={}, idx=0) => `
  <div class="nzb-server" data-nzb-server>
    <div class="row" style="justify-content:space-between;align-items:center">
      <strong style="font-size:.85rem">News Server ${idx + 1}</strong>
      <button type="button" class="act" data-nzb-remove>Remove</button>
    </div>
    <label>Name</label>
    <input data-nzb-name value="${escAttr(s.name || '')}" placeholder="Primary">
    <label>Host</label>
    <input data-nzb-host value="${escAttr(s.host || '')}" placeholder="news.example.com" autocomplete="off">
    <div class="row" style="align-items:end">
      <div style="flex:1"><label>Port</label>
        <input data-nzb-port type="number" min="1" max="65535" value="${escAttr(s.port ?? 563)}"></div>
      <div style="flex:1"><label>Connections</label>
        <input data-nzb-conn type="number" min="1" max="60" value="${escAttr(s.connections ?? 8)}"></div>
      <label class="row" style="width:auto;margin:0 0 .35rem;gap:.4rem;align-items:center">
        <input type="checkbox" data-nzb-enc ${(s.encryption !== false) ? 'checked' : ''}>
        TLS
      </label>
    </div>
    <label>Username</label>
    <input data-nzb-user value="${escAttr(s.username || '')}" autocomplete="username">
    <label>Password</label>
    <input data-nzb-pass type="password" value="${escAttr(s.password || '')}" autocomplete="current-password">
  </div>`;

const escAttr = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const bindNzbServerList = (listEl, addBtn) => {
  const renumber = () => {
    [...listEl.querySelectorAll('[data-nzb-server]')].forEach((el, i) => {
      const title = el.querySelector('strong');
      if (title) title.textContent = `News Server ${i + 1}`;
    });
  };
  listEl.onclick = (e) => {
    const btn = e.target.closest('[data-nzb-remove]');
    if (!btn) return;
    btn.closest('[data-nzb-server]')?.remove();
    renumber();
  };
  if (addBtn) addBtn.onclick = () => {
    listEl.insertAdjacentHTML('beforeend', nzbServerRowHtml(emptyNzbServer(), listEl.children.length));
  };
};

const dispatchStatusBadge = (status) => {
  const s = String(status || 'unknown').toLowerCase();
  const ok = s === 'success' || s === 'idle';
  const cls = ok ? 'vpn-active' : (s === 'error' ? 'watch-badge' : 'vpn-wg');
  return `<span class="watch-badge ${cls}">${escHtml(status || 'unknown')}</span>`;
};

const renderDispatchM3uList = (rows=[]) => {
  const listed = rows.filter(r => !(r.account_type === 'STD' && !r.server_url));
  if (!listed.length) {
    return '<p style="color:var(--muted);font-size:.85rem;margin:.5rem 0">No M3U accounts yet.</p>';
  }
  return listed.map(row => `
    <article class="dispatch-source" data-m3u-id="${escAttr(row.id)}">
      <div class="dispatch-source-top">
        <div>
          <h4 class="dispatch-source-title">${escHtml(row.name || 'Unnamed')}</h4>
          <div class="dispatch-source-meta">${escHtml(row.account_type || '')}${row.server_url ? ` · ${escHtml(row.server_url)}` : ''}${row.max_streams != null ? ` · ${row.max_streams === 0 ? 'unlimited streams' : `${escHtml(String(row.max_streams))} streams`}` : ''}</div>
        </div>
        ${dispatchStatusBadge(row.status)}
      </div>
      <div class="dispatch-source-actions">
        <button type="button" class="act" data-dispatch-m3u-refresh="${escAttr(row.id)}">Refresh</button>
        <button type="button" class="act" data-dispatch-m3u-delete="${escAttr(row.id)}">Delete</button>
      </div>
    </article>`).join('');
};

const renderDispatchEpgList = (rows=[]) => {
  if (!rows.length) {
    return '<p style="color:var(--muted);font-size:.85rem;margin:.5rem 0">No EPG sources yet.</p>';
  }
  return rows.map(row => `
    <article class="dispatch-source" data-epg-id="${escAttr(row.id)}">
      <div class="dispatch-source-top">
        <div>
          <h4 class="dispatch-source-title">${escHtml(row.name || 'Unnamed')}</h4>
          <div class="dispatch-source-meta">${escHtml(row.source_type || '')}${row.url ? ` · ${escHtml(row.url)}` : ''}</div>
        </div>
        ${dispatchStatusBadge(row.status)}
      </div>
      <div class="dispatch-source-actions">
        <button type="button" class="act" data-dispatch-epg-refresh="${escAttr(row.id)}">Refresh</button>
        <button type="button" class="act" data-dispatch-epg-delete="${escAttr(row.id)}">Delete</button>
      </div>
    </article>`).join('');
};

const promptDispatchM3u = () => new Promise((resolve) => {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal vpn-modal" role="dialog" aria-labelledby="dispatch-m3u-title">
      <h3 id="dispatch-m3u-title">Add M3U Account</h3>
      <label for="dispatch-m3u-name">Name</label>
      <input id="dispatch-m3u-name" autocomplete="off" placeholder="Lumen-direct">
      <label for="dispatch-m3u-type">Type</label>
      <select id="dispatch-m3u-type">
        <option value="XC" selected>Xtream Codes</option>
        <option value="STD">M3U URL</option>
      </select>
      <label for="dispatch-m3u-url">Server URL</label>
      <input id="dispatch-m3u-url" autocomplete="off" placeholder="https://my.xc4.net">
      <label for="dispatch-m3u-user">Username</label>
      <input id="dispatch-m3u-user" autocomplete="username">
      <label for="dispatch-m3u-pass">Password</label>
      <input id="dispatch-m3u-pass" type="password" autocomplete="current-password">
      <label for="dispatch-m3u-streams">Maximum streams</label>
      <input id="dispatch-m3u-streams" type="number" min="0" step="1" value="0" inputmode="numeric">
      <p style="color:var(--muted);font-size:.8rem;margin:.25rem 0 0">Concurrent streams for this account. Use 0 for unlimited.</p>
      <p class="err" id="dispatch-m3u-err"></p>
      <div class="row" style="margin-top:1rem">
        <button type="button" class="act primary" id="dispatch-m3u-save">Add Account</button>
        <button type="button" class="act" id="dispatch-m3u-cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const finish = (value) => { backdrop.remove(); resolve(value); };
  $('#dispatch-m3u-cancel', backdrop).onclick = () => finish(null);
  backdrop.onclick = (e) => { if (e.target === backdrop) finish(null); };
  $('#dispatch-m3u-save', backdrop).onclick = () => {
    const name = $('#dispatch-m3u-name', backdrop).value.trim();
    const server_url = $('#dispatch-m3u-url', backdrop).value.trim();
    const maxRaw = $('#dispatch-m3u-streams', backdrop).value.trim();
    const max_streams = maxRaw === '' ? 0 : Number(maxRaw);
    if (!name) { $('#dispatch-m3u-err', backdrop).textContent = 'Name is required.'; return; }
    if (!server_url) { $('#dispatch-m3u-err', backdrop).textContent = 'Server URL is required.'; return; }
    if (!Number.isInteger(max_streams) || max_streams < 0) {
      $('#dispatch-m3u-err', backdrop).textContent = 'Maximum streams must be 0 or a positive whole number.';
      return;
    }
    finish({
      name,
      account_type: $('#dispatch-m3u-type', backdrop).value,
      server_url,
      username: $('#dispatch-m3u-user', backdrop).value.trim(),
      password: $('#dispatch-m3u-pass', backdrop).value,
      max_streams,
    });
  };
});

const promptDispatchEpg = () => new Promise((resolve) => {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal vpn-modal" role="dialog" aria-labelledby="dispatch-epg-title">
      <h3 id="dispatch-epg-title">Add EPG Source</h3>
      <label for="dispatch-epg-name">Name</label>
      <input id="dispatch-epg-name" autocomplete="off" placeholder="Provider EPG">
      <label for="dispatch-epg-type">Type</label>
      <select id="dispatch-epg-type">
        <option value="xmltv" selected>XMLTV URL</option>
        <option value="schedules_direct">Schedules Direct</option>
        <option value="dummy">Custom Dummy EPG</option>
      </select>
      <label for="dispatch-epg-url">URL</label>
      <input id="dispatch-epg-url" autocomplete="off" placeholder="https://example.com/epg.xml">
      <label for="dispatch-epg-user">Username</label>
      <input id="dispatch-epg-user" autocomplete="username">
      <label for="dispatch-epg-pass">Password</label>
      <input id="dispatch-epg-pass" type="password" autocomplete="current-password">
      <p class="err" id="dispatch-epg-err"></p>
      <div class="row" style="margin-top:1rem">
        <button type="button" class="act primary" id="dispatch-epg-save">Add Source</button>
        <button type="button" class="act" id="dispatch-epg-cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const finish = (value) => { backdrop.remove(); resolve(value); };
  $('#dispatch-epg-cancel', backdrop).onclick = () => finish(null);
  backdrop.onclick = (e) => { if (e.target === backdrop) finish(null); };
  $('#dispatch-epg-save', backdrop).onclick = () => {
    const name = $('#dispatch-epg-name', backdrop).value.trim();
    const source_type = $('#dispatch-epg-type', backdrop).value;
    const url = $('#dispatch-epg-url', backdrop).value.trim();
    if (!name) { $('#dispatch-epg-err', backdrop).textContent = 'Name is required.'; return; }
    if (source_type === 'xmltv' && !url) {
      $('#dispatch-epg-err', backdrop).textContent = 'URL is required for XMLTV sources.';
      return;
    }
    finish({
      name,
      source_type,
      url,
      username: $('#dispatch-epg-user', backdrop).value.trim(),
      password: $('#dispatch-epg-pass', backdrop).value,
    });
  };
});

const loadDispatcharrSources = async () => {
  const m3uBox = $('#dispatcharr-m3u-list');
  const epgBox = $('#dispatcharr-epg-list');
  const note = $('#dispatcharr-sources-note');
  if (!m3uBox || !epgBox) return;
  if (note) note.textContent = 'Loading Dispatcharr sources…';
  try {
    const [m3u, epg] = await Promise.all([
      api('/dispatcharr/m3u'),
      api('/dispatcharr/epg'),
    ]);
    m3uBox.innerHTML = renderDispatchM3uList(m3u.accounts || []);
    epgBox.innerHTML = renderDispatchEpgList(epg.sources || []);
    if (note) note.textContent = '';
  } catch (e) {
    m3uBox.innerHTML = '';
    epgBox.innerHTML = '';
    if (note) note.innerHTML = `<span style="color:var(--bad)">${escHtml(e.message || String(e))}</span>`;
  }
};

const bindDispatcharrSources = () => {
  const msg = $('#live-tv-msg');
  const showMsg = (html) => { if (msg) msg.innerHTML = html; };
  $('#dispatcharr-m3u-add')?.addEventListener('click', async () => {
    const body = await promptDispatchM3u();
    if (!body) return;
    showMsg('<div class="banner" style="border:1px solid var(--line)">Adding M3U account… this can take a few minutes.</div>');
    try {
      await api('/dispatcharr/m3u', {method:'POST', body: JSON.stringify(body)});
      showMsg('<div class="banner ok">M3U account added.</div>');
      await loadDispatcharrSources();
    } catch (e) {
      showMsg(`<div class="banner bad">${escHtml(e.message || String(e))}</div>`);
    }
  });
  $('#dispatcharr-epg-add')?.addEventListener('click', async () => {
    const body = await promptDispatchEpg();
    if (!body) return;
    showMsg('<div class="banner" style="border:1px solid var(--line)">Adding EPG source…</div>');
    try {
      await api('/dispatcharr/epg', {method:'POST', body: JSON.stringify(body)});
      showMsg('<div class="banner ok">EPG source added.</div>');
      await loadDispatcharrSources();
    } catch (e) {
      showMsg(`<div class="banner bad">${escHtml(e.message || String(e))}</div>`);
    }
  });
  $('#dispatcharr-m3u-list')?.addEventListener('click', async (e) => {
    const refreshBtn = e.target.closest('[data-dispatch-m3u-refresh]');
    const deleteBtn = e.target.closest('[data-dispatch-m3u-delete]');
    if (refreshBtn) {
      showMsg('<div class="banner" style="border:1px solid var(--line)">Refreshing M3U account…</div>');
      try {
        await api(`/dispatcharr/m3u/${refreshBtn.dataset.dispatchM3uRefresh}/refresh`, {method:'POST'});
        showMsg('<div class="banner ok">M3U refresh started.</div>');
        await loadDispatcharrSources();
      } catch (err) {
        showMsg(`<div class="banner bad">${escHtml(err.message || String(err))}</div>`);
      }
      return;
    }
    if (deleteBtn) {
      if (!confirm('Delete this M3U account from Dispatcharr?')) return;
      try {
        await api(`/dispatcharr/m3u/${deleteBtn.dataset.dispatchM3uDelete}`, {method:'DELETE'});
        showMsg('<div class="banner ok">M3U account deleted.</div>');
        await loadDispatcharrSources();
      } catch (err) {
        showMsg(`<div class="banner bad">${escHtml(err.message || String(err))}</div>`);
      }
    }
  });
  $('#dispatcharr-epg-list')?.addEventListener('click', async (e) => {
    const refreshBtn = e.target.closest('[data-dispatch-epg-refresh]');
    const deleteBtn = e.target.closest('[data-dispatch-epg-delete]');
    if (refreshBtn) {
      showMsg('<div class="banner" style="border:1px solid var(--line)">Refreshing EPG source…</div>');
      try {
        await api(`/dispatcharr/epg/${refreshBtn.dataset.dispatchEpgRefresh}/refresh`, {method:'POST'});
        showMsg('<div class="banner ok">EPG refresh started.</div>');
        await loadDispatcharrSources();
      } catch (err) {
        showMsg(`<div class="banner bad">${escHtml(err.message || String(err))}</div>`);
      }
      return;
    }
    if (deleteBtn) {
      if (!confirm('Delete this EPG source from Dispatcharr?')) return;
      try {
        await api(`/dispatcharr/epg/${deleteBtn.dataset.dispatchEpgDelete}`, {method:'DELETE'});
        showMsg('<div class="banner ok">EPG source deleted.</div>');
        await loadDispatcharrSources();
      } catch (err) {
        showMsg(`<div class="banner bad">${escHtml(err.message || String(err))}</div>`);
      }
    }
  });
};

const promptNzbgetServers = (existing=[]) => new Promise((resolve) => {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-labelledby="nzb-modal-title">
      <h3 id="nzb-modal-title">NZBGet News Servers</h3>
      <p>Add one or more Usenet news servers. Extended Unpacker, Fake Detector,
         and Remove Samples are installed automatically. You can change servers
         later in Settings.</p>
      <div id="nzb-modal-list"></div>
      <div class="row" style="margin:.5rem 0 1rem">
        <button type="button" class="act" id="nzb-modal-add">Add Server</button>
      </div>
      <div class="row" style="gap:.5rem;flex-wrap:wrap">
        <button type="button" class="act primary" id="nzb-modal-enable">Enable With These Servers</button>
        <button type="button" class="act" id="nzb-modal-skip">Skip for Now</button>
        <button type="button" class="act" id="nzb-modal-cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const list = $('#nzb-modal-list', backdrop);
  const servers = (existing && existing.length) ? existing : [emptyNzbServer()];
  list.innerHTML = servers.map((s, i) => nzbServerRowHtml(s, i)).join('');
  bindNzbServerList(list, $('#nzb-modal-add', backdrop));
  const finish = (result) => { backdrop.remove(); resolve(result); };
  $('#nzb-modal-cancel', backdrop).onclick = () => finish({cancelled: true});
  $('#nzb-modal-skip', backdrop).onclick = () => finish({skip: true});
  $('#nzb-modal-enable', backdrop).onclick = () =>
    finish({servers: collectNzbServers(backdrop)});
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) finish({cancelled: true});
  });
});

const enableNzbgetFlow = async (btn) => {
  let settings = {};
  try { settings = await api('/settings'); } catch (_) { settings = {}; }
  // Always prompt when no real host is stored (empty env, placeholders, Skip).
  const existing = (settings.nzbget_news_servers || []).filter(s => s && s.host);
  let body = undefined;
  if (!existing.length) {
    const choice = await promptNzbgetServers([]);
    if (choice.cancelled) {
      btn.disabled = false; btn.textContent = 'Enable';
      return;
    }
    if (choice.skip) {
      body = {news_servers: []};
    } else {
      const servers = choice.servers || [];
      if (!servers.length) {
        btn.disabled = false; btn.textContent = 'Enable';
        const tierMsg = $('#tier-msg');

const promptTeamarrLeagues = (preselected) => new Promise(async (resolve) => {
  let catalog = [];
  let selected = new Set();
  try {
    const data = await api('/teamarr/leagues');
    catalog = (data.catalog && data.catalog.length) ? data.catalog : (data.leagues || []);
    const picks = (preselected && preselected.length)
      ? preselected
      : (data.leagues || []);
    picks.forEach(r => { if (r && r.id) selected.add(r.id); });
  } catch (_) {
    catalog = [];
  }
  if (!catalog.length) {
    catalog = [
      {id:'eng.1', name:'English Premier League'},
      {id:'eng.fa', name:'FA Cup'},
      {id:'eng.league_cup', name:'Carabao Cup'},
      {id:'uefa.champions', name:'UEFA Champions League'},
      {id:'uefa.champions_qual', name:'UEFA Champions League Qualifying'},
      {id:'uefa.europa', name:'UEFA Europa League'},
      {id:'uefa.europa.conf', name:'UEFA Europa Conference League'},
      {id:'fifa.world', name:'FIFA World Cup'},
      {id:'fifa.wcq.ply', name:'FIFA World Cup Qualifying - Playoff Tournament'},
    ];
    if (!selected.size) catalog.forEach(r => selected.add(r.id));
  }
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const rows = catalog.map(r => {
    const checked = selected.has(r.id) ? 'checked' : '';
    const start = r.channel_start != null ? ` · ch ${r.channel_start}` : '';
    return `<label class="teamarr-league-row">
      <input type="checkbox" data-league-id="${escAttr(r.id)}" data-league-name="${escAttr(r.name || r.id)}" ${checked}>
      <span>${escHtml(r.name || r.id)}${escHtml(start)}</span>
    </label>`;
  }).join('');
  backdrop.innerHTML = `
    <div class="modal" role="dialog" aria-labelledby="teamarr-modal-title">
      <h3 id="teamarr-modal-title">Teamarr Soccer Leagues</h3>
      <p>Choose leagues for Select Leagues mode. Channel numbers use fixed
         blocks of 20 starting at 2000. Your last picks are remembered.</p>
      <div id="teamarr-modal-list" style="max-height:50vh;overflow:auto;margin:.75rem 0">${rows}</div>
      <div class="row" style="gap:.5rem;flex-wrap:wrap">
        <button type="button" class="act primary" id="teamarr-modal-enable">Enable With These Leagues</button>
        <button type="button" class="act" id="teamarr-modal-cancel">Cancel</button>
      </div>
      <div id="teamarr-modal-err" class="banner bad" style="display:none;margin-top:.75rem"></div>
    </div>`;
  document.body.appendChild(backdrop);
  const finish = (result) => { backdrop.remove(); resolve(result); };
  $('#teamarr-modal-cancel', backdrop).onclick = () => finish({cancelled: true});
  $('#teamarr-modal-enable', backdrop).onclick = () => {
    const leagues = [...backdrop.querySelectorAll('[data-league-id]:checked')].map(el => ({
      id: el.dataset.leagueId,
      name: el.dataset.leagueName || el.dataset.leagueId,
    }));
    if (!leagues.length) {
      const err = $('#teamarr-modal-err', backdrop);
      err.style.display = 'block';
      err.textContent = 'Select at least one league.';
      return;
    }
    finish({leagues});
  };
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) finish({cancelled: true});
  });
});

// Embeddable apps open in an in-page iframe on /view/{app}/ (same host
// certificate as Helm). Others still open in a new tab.
const closeEmbed = () => {
  const overlay = $('#embed-overlay');
  const frame = $('#embed-frame');
  if (!overlay) return;
  overlay.classList.remove('open');
  if (frame) frame.src = 'about:blank';
  document.body.style.overflow = '';
};

const openEmbed = (app) => {
  let overlay = $('#embed-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'embed-overlay';
    overlay.className = 'embed-overlay';
    overlay.innerHTML = `
      <div class="embed-bar">
        <h2 id="embed-title"></h2>
        <a class="act" id="embed-external" target="_blank" rel="noopener noreferrer">New Tab</a>
        <button class="act" type="button" id="embed-close">Close</button>
      </div>
      <iframe id="embed-frame" title="Embedded app"></iframe>`;
    document.body.appendChild(overlay);
    $('#embed-close').onclick = closeEmbed;
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && overlay.classList.contains('open')) closeEmbed();
    });
  }
  $('#embed-title').textContent = app.name || app.id;
  const external = $('#embed-external');
  if (app.url) {
    external.href = app.url;
    external.style.display = '';
  } else {
    external.removeAttribute('href');
    external.style.display = 'none';
  }
  $('#embed-frame').src = app.embed_url;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
};

const launchApp = (app) => {
  const tierMsg = $('#tier-msg');
  const name = app?.name || 'application';
  if (app?.embed_url) {
    openEmbed(app);
    return;
  }
  if (!app?.url) {
    tierMsg.className = 'banner bad';
    tierMsg.textContent = `Could not open ${name}. No launch URL is configured.`;
    return;
  }
  const w = window.open(app.url, '_blank');
  if (w) {
    w.opener = null;
    return;
  }
  try {
    window.location.assign(app.url);
    return;
  } catch (_) {}
  tierMsg.className = 'banner bad';
  tierMsg.innerHTML =
    `Could not open ${name}. Copy this URL into a new tab: ` +
    `<a class="link" href="${app.url}" target="_blank" rel="noopener noreferrer">${app.url}</a>`;
};

const formatRate = (bytesPerSec) => {
  const n = Number(bytesPerSec) || 0;
  if (n < 1024) return `${n} B/s`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB/s`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB/s`;
};
const watchPanel = (w) => {

  }

  const errors = Object.entries(w.errors || {}).map(([k,v]) => `${k}: ${v}`).join(' · ');
  if (!sessions.length) {
    return `<p style="color:var(--muted);margin:0">Nothing is playing right now.</p>

    if (/^(HEVC|H265|H264|AVC|AV1|VP9|MPEG2|MPEG4|VC1|XVID|WMV)$/.test(u)) return 'format-video';
    if (/^(AAC|AC3|EAC3|DTS|TRUEHD|FLAC|OPUS|MP3|PCM|VORBIS|ALAC|DDP)$/.test(u)) return 'format-audio';
    return 'format-res';

  const artFallback = (mono) =>
    `<span class="watch-art-fallback"><span class="mono">${escHtml(mono)}</span></span>`;
  const cards = sessions.map(s => {
    const server = s.server === 'plex' ? 'Plex' : 'Emby';

    const formatPills = [
      ...formats.map(f => `<span class="watch-badge ${formatClass(f)}">${escHtml(f)}</span>`),
      ...(s.stream ? [`<span class="watch-badge ${streamClass}">${escHtml(s.stream)}</span>`] : []),

        </div>
        ${meta.length ? `<div class="watch-meta">${meta.join('')}</div>` : ''}
        ${progress}
      </article>`;
    }).join('')}</div>`;
  }
  return `${summaries.length ? `<div class="dl-summary">${summaries.join('')}</div>` : ''}
    ${cards}
    ${Object.keys(errors).length && !summaries.some(s => s.includes('warn'))
      ? `<p style="color:var(--warn);font-size:.8rem;margin:.75rem 0 0">${escHtml(Object.entries(errors).map(([k,v]) => `${k}: ${v}`).join(' · '))}</p>`
      : ''}`;
};
const mediaServerCard = (s) => {
  const title = s.name || s.label || 'Media Server';
  const summary = s.ok
    ? (s.version ? `${s.label} · ${s.version}` : (s.detail || s.label || 'Online'))
    : (s.error || 'Unreachable');
  const hostLine = s.host
    ? `<p style="color:var(--muted);font-size:.8rem;margin:.35rem 0 0">${escHtml(s.host)}</p>`
    : '';
  return `<div class="card">
    <h3><span class="dot ${s.ok?'on':'off'}"></span>${escHtml(title)}</h3>
    <p>${escHtml(summary)}</p>
    ${hostLine}
    <div class="row">
      ${s.url ? `<button class="act" data-media-url="${escAttr(s.url)}">Open</button>` : ''}
    </div>
  </div>`;
};
const mediaServersCards = (m) => {
  const configured = m.configured || {};
  if (!configured.plex && !configured.emby) return '';
  return (m.servers || []).map(mediaServerCard).join('');
};
const appsSectionsHtml = (items) => {
  const enabled = items.filter(a => a.enabled);
  const disabled = items.filter(a => !a.enabled);
  const section = (title, apps) => {
    if (!apps.length) return '';
    return `<div class="apps-section">
      <h3 class="apps-section-title">${title}</h3>
      <div class="grid">${apps.map(appCard).join('')}</div>
    </div>`;
  };
  const body = `${section('Enabled', enabled)}${section('Disabled', disabled)}`;
  return body || '<p style="color:var(--muted);margin:0">No apps in this group.</p>';
};
const mediaPanelHtml = (m, items) => {
  const servers = mediaServersCards(m);
  const apps = items.length ? appsSectionsHtml(items) : '';
  if (servers || apps) {
    return `<div id="media-panel">${servers ? `<div class="grid">${servers}</div>` : ''}${apps}</div>`;
  }
  return '<p style="color:var(--muted);margin:0">Add Plex or Emby credentials in Settings, or enable a media app.</p>';
};
const mediaStatHtml = (m, stats) => {
  const configured = m.configured || {};
  const hasSettings = configured.plex || configured.emby;
  if (hasSettings) {
    const online = m.online || 0;
    const count = m.count || 0;
    if (count) {
      return `${online}<span> / ${count} online</span>`;
    }
  }
  return `${stats.running}<span> / ${stats.total} running</span>`;
};
const appCard = a => `
  <div class="card">
    <h3><span class="dot ${a.running?'on':'off'}"></span>${a.name}</h3>
    <p>${a.summary}</p>
    ${a.tunnelled==='forced'?'<p style="color:var(--warn)">Always Tunnelled</p>':''}
    ${a.dev_supported ? `<label class="tier-switch" style="margin:.15rem 0" aria-label="Dev Version">
      <input type="checkbox" data-dev="${a.id}" ${a.dev_enabled?'checked':''}>
      <span class="tier-switch-ui" aria-hidden="true"></span>
      <span style="margin-left:.55rem;font-size:.8rem;color:var(--muted)">Dev Version${a.dev_enabled && a.dev_tag ? ` (${a.dev_tag})` : ''}</span>
    </label>` : ''}
    <div class="row">
      ${a.enabled
        ? `<button class="act" data-act="disable" data-id="${a.id}">Disable</button>
           <button class="act" data-act="restart" data-id="${a.id}">Restart</button>`
        : `<button class="act primary" data-act="enable" data-id="${a.id}">Enable</button>`}
      ${a.url && a.enabled ? `<button class="act" data-open="${a.id}">Open</button>`:''}
    </div>
  </div>`;

render.apps = async () => {
  if (state.watchTimer) { clearInterval(state.watchTimer); state.watchTimer = null; }
  const emptyDownloads = {active:0, configured:{}, transmission:null, nzbget:null, errors:{}};
  const emptyMedia = {count:0, online:0, configured:{}, servers:[]};
  const [data, watch, dl, media] = await Promise.all([
    api('/apps'),
    api('/watching').catch(() => ({count:0, sessions:[], configured:{}, errors:{}})),
    api('/downloads').catch(() => emptyDownloads),
    api('/media-servers').catch(() => emptyMedia),
  ]);
  state.apps = data.apps;
  state.tiers = data.tiers;
  const visibleTiers = TIER_ORDER.filter(tier => {
    const meta = state.tiers[tier];
    return meta && state.apps.some(a => a.tier === tier && !a.hidden);
  });
  const special = new Set(['watching', 'downloads']);
  if (!special.has(state.activeTier) && !visibleTiers.includes(state.activeTier))
    state.activeTier = visibleTiers.find(t => state.tiers[t]?.enabled) || visibleTiers[0] || null;
  const watchingActive = state.activeTier === 'watching';
  const downloadsActive = state.activeTier === 'downloads';
  const mediaActive = state.activeTier === 'media';
  const watchCount = watch.count || 0;
  const dlActive = dl.active || 0;
  const watchBtn = `<div class="overview-btn ${watchingActive?'active':''}${watchCount?' watching-live':''}"
      data-overview="watching" role="button" tabindex="0" aria-pressed="${watchingActive}">
      <div class="overview-top"><h2>Watching</h2></div>
      <div class="overview-stat">${watchCount}<span> ${watchCount===1?'session':'sessions'}</span></div>
    </div>`;
  const downloadsBtn = `<div class="overview-btn ${downloadsActive?'active':''}${dlActive?' downloads-live':''}"
      data-overview="downloads" role="button" tabindex="0" aria-pressed="${downloadsActive}">
      <div class="overview-top"><h2>Downloads</h2></div>
      <div class="overview-stat">${dlActive}<span> active</span></div>
    </div>`;
  const overview = visibleTiers.map(tier => {
    const meta = state.tiers[tier];
    const stats = tierStats(state.apps.filter(a => a.tier === tier && !a.hidden));
    const active = state.activeTier === tier;
    const settingsMedia = !!(media.configured?.plex || media.configured?.emby);
    const mediaTicked = tier === 'media' && settingsMedia;
    const tierOn = mediaTicked || !!meta.enabled;
    const stat = tier === 'media' ? mediaStatHtml(media, stats)
      : `${stats.running}<span> / ${stats.total} running</span>`;
    const switchHtml = mediaTicked
      ? `<label class="tier-switch settings-configured" title="Plex/Emby configured in Settings" aria-label="Media servers configured in Settings">
          <input type="checkbox" checked disabled>
          <span class="tier-switch-ui" aria-hidden="true"></span>
        </label>`
      : `<label class="tier-switch" aria-label="${meta.enabled?'Disable':'Enable'} ${meta.label}">
          <input type="checkbox" data-tier="${tier}" ${meta.enabled?'checked':''}>
          <span class="tier-switch-ui" aria-hidden="true"></span>
        </label>`;
    return `<div class="overview-btn ${active?'active':''} ${!tierOn?'off-tier':''}"
      data-overview="${tier}" role="button" tabindex="0" aria-pressed="${active}">
      <div class="overview-top">
        <h2>${meta.label}</h2>
        ${switchHtml}
      </div>
      <div class="overview-stat">${stat}</div>
    </div>`;
  }).join('');
  const activeItems = (!watchingActive && !downloadsActive && state.activeTier)
    ? state.apps.filter(a => a.tier === state.activeTier && !a.hidden) : [];
  let panel;
  if (watchingActive) panel = `<div id="watch-panel">${watchPanel(watch)}</div>`;
  else if (downloadsActive) panel = `<div id="downloads-panel">${downloadsPanel(dl)}</div>`;
  else if (mediaActive) {
    panel = mediaPanelHtml(media, activeItems);
  } else panel = activeItems.length
    ? appsSectionsHtml(activeItems)
    : '<p style="color:var(--muted);margin:0">No apps in this group.</p>';
  const body = `<div id="tier-msg"></div>
    <div class="overview-bar">${watchBtn}${downloadsBtn}${overview}</div>
    <div class="apps-panel">${panel}</div>`;
  render.shell(body);
  if (watchingActive) {
    state.watchTimer = setInterval(async () => {
      const next = await api('/watching').catch(() => null);
      if (!next || state.activeTier !== 'watching') return;
      const box = $('#watch-panel');
      if (box) box.innerHTML = watchPanel(next);
      const btn = document.querySelector('[data-overview="watching"]');
      const stat = btn && btn.querySelector('.overview-stat');
      if (stat) stat.innerHTML = `${next.count||0}<span> ${(next.count||0)===1?'session':'sessions'}</span>`;
      if (btn) btn.classList.toggle('watching-live', !!(next.count||0));
    }, 15000);
  }
  if (downloadsActive) {
    state.watchTimer = setInterval(async () => {
      const next = await api('/downloads').catch(() => null);
      if (!next || state.activeTier !== 'downloads') return;
      const box = $('#downloads-panel');
      if (box) box.innerHTML = downloadsPanel(next);
      const btn = document.querySelector('[data-overview="downloads"]');
      const stat = btn && btn.querySelector('.overview-stat');
      if (stat) stat.innerHTML = `${next.active||0}<span> active</span>`;
      if (btn) btn.classList.toggle('downloads-live', !!(next.active||0));
    }, 15000);
  }
  if (mediaActive) {
    state.watchTimer = setInterval(async () => {
      const next = await api('/media-servers').catch(() => null);
      if (!next || state.activeTier !== 'media') return;
      const wrap = document.querySelector('.apps-panel');
      const tierApps = state.apps.filter(a => a.tier === 'media' && !a.hidden);
      if (wrap) wrap.innerHTML = mediaPanelHtml(next, tierApps);
      const btn = document.querySelector('[data-overview="media"]');
      const statEl = btn && btn.querySelector('.overview-stat');
      if (statEl) statEl.innerHTML = mediaStatHtml(next, tierStats(tierApps));
      document.querySelectorAll('[data-media-url]').forEach(b => {
        b.onclick = () => {
          const w = window.open(b.dataset.mediaUrl, '_blank');
          if (w) w.opener = null;
        };
      });
      document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
        const id = b.dataset.id;
        const act = b.dataset.act;
        b.disabled = true; b.textContent = 'Working...';
        await api(`/apps/${id}/${act}`, {method:'POST'});
        render.apps();
      });
      document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
        launchApp(state.apps.find(a => a.id === b.dataset.open));
      });
    }, 15000);
  }
  document.querySelectorAll('[data-overview]').forEach(el => {
    const pick = () => { state.activeTier = el.dataset.overview; render.apps(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  document.querySelectorAll('[data-tier]').forEach(el => {
    el.onchange = async () => {
      el.disabled = true;
      try {
        let body = '{}';
        if (el.checked && el.dataset.tier === 'live') {
          const teamarr = state.apps.find(a => a.id === 'teamarr');
          if (teamarr && !teamarr.enabled) {
            const choice = await promptTeamarrLeagues();
            if (choice.cancelled) {
              el.checked = false;
              el.disabled = false;
              return;
            }
            body = JSON.stringify({leagues: choice.leagues || []});
          }
        }
        await api(`/tiers/${el.dataset.tier}/${el.checked?'enable':'disable'}`, {
          method:'POST',
          body,
        });
        if (el.checked) state.activeTier = el.dataset.tier;
        await render.apps();
      } catch (e) {
        el.checked = !el.checked;
        const tierMsg = $('#tier-msg');
        tierMsg.className = 'banner bad';
        tierMsg.textContent = e.message || 'Could not update section';
        el.disabled = false;
      }
    };
    el.onclick = e => e.stopPropagation();
  });
  document.querySelectorAll('[data-dev]').forEach(el => {
    el.onchange = async () => {
      el.disabled = true;
      try {
        await api(`/apps/${el.dataset.dev}/dev/${el.checked?'enable':'disable'}`, {method:'POST'});
        render.apps();
      } catch (e) {
        el.checked = !el.checked;
        const tierMsg = $('#tier-msg');
        tierMsg.className = 'banner bad';
        tierMsg.textContent = e.message || 'Could not update image channel';
        el.disabled = false;
      }
    };
  });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    const act = b.dataset.act;
    const labels = {enable:'Enable', disable:'Disable', restart:'Restart'};
    const reset = () => { b.disabled = false; b.textContent = labels[act] || act; };
    const fail = (e) => {
      reset();
      const tierMsg = $('#tier-msg');
      if (tierMsg) {
        tierMsg.className = 'banner bad';
        tierMsg.textContent = e.message || `Could not ${act} ${id}`;
      }
    };
    if (act === 'enable' && id === 'nzbget') {
      b.disabled = true; b.textContent = 'Working...';
      try {
        await enableNzbgetFlow(b);
      } catch (e) { fail(e); }
      return;
    }
    if (act === 'enable' && id === 'teamarr') {
      b.disabled = true; b.textContent = 'Working...';
      try {
        await enableTeamarrFlow(b);
      } catch (e) { fail(e); }
      return;
    }
    b.disabled = true; b.textContent = 'Working...';
    try {
      await api(`/apps/${id}/${act}`, {method:'POST'});
      await render.apps();
    } catch (e) {
      fail(e);
    }
  });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    launchApp(state.apps.find(a => a.id === b.dataset.open));
  });
  document.querySelectorAll('[data-media-url]').forEach(b => {
    b.onclick = () => {
      const w = window.open(b.dataset.mediaUrl, '_blank');
      if (w) w.opener = null;
    };
  });
};

render.updates = async (refresh=false) => {
  render.shell(`<div class="section"><h2>Image Updates</h2>
    <p style="color:var(--muted);font-size:.85rem">Nothing updates on its own.
    The overnight job only checks digests; applying an update snapshots
    config first and rolls back if the app does not come back healthy.
    Update All runs one at a time. Core stack containers (Traefik, VPN,
    dockerproxy) are updated on the host, not from here.</p>
    <div class="row" style="margin-bottom:1rem">
      <button class="act" id="refresh">Check Now</button>
      <span id="age" style="color:var(--muted);font-size:.8rem"></span>
    </div>
    <div id="updates-progress" class="banner" style="display:none"></div>
    <div id="updates-body"><p style="color:var(--muted)">${
      refresh ? 'checking registries…' : 'loading…'
    }</p></div>
    <pre id="rep" style="margin-top:1rem;display:none"></pre></div>`);
  $('#refresh').onclick = () => render.updates(true);
  const r = await api('/updates' + (refresh ? '?refresh=true' : ''));
  const rows = r.containers || [];
  $('#age').textContent = r.cached ? `cached, checked ${r.checked || 'unknown'}` : 'just checked';
  const fmtDigest = d => (!d || d === 'none' || d === '?') ? '—' : d;
  const rowHtml = (list) => list.map(c => {
    const ch = c.channel === 'dev'
      ? `<span class="badge dev">dev</span>`
      : `<span class="badge muted">prod</span>`;
    const tag = c.configured_tag || c.tag || 'latest';
    const stable = c.stable_tag ? `<span style="color:var(--muted);font-size:.75rem"> ← ${c.stable_tag}</span>` : '';
    const st = c.update_available
      ? `<span class="badge warn">update</span>`
      : `<span class="badge ok">current</span>`;
    const run = c.running ? '' : ' <span style="color:var(--muted)">(stopped)</span>';
    let btn = '';
    if (c.update_available && c.host_only) {
      btn = `<button class="act" data-host-up="${c.id}" title="Must be updated on the host">Host only</button>`;
    } else if (c.update_available && c.enabled === false) {
      btn = `<span style="color:var(--muted);font-size:.78rem">disabled</span>`;
    } else if (c.update_available) {
      btn = `<button class="act primary" data-up="${c.id}">Update</button>`;
    }
    return `<tr data-row="${c.id}">
      <td><strong>${c.name || c.id}</strong><span style="color:var(--muted)">${run}</span></td>
      <td>${ch}</td>
      <td class="mono">${tag}${stable}</td>
      <td class="mono" data-local-digest="${c.id}">${fmtDigest(c.local_digest)}</td>
      <td class="mono">${fmtDigest(c.remote_digest)}</td>
      <td data-row-status="${c.id}">${st}</td>
      <td data-row-action="${c.id}">${btn}</td>
    </tr>`;
  }).join('');
  const section = (title, list, key) => {
    // host_only and profile-disabled rows are listed but not in Update All.
    const pending = list.filter(c =>
      c.update_available && !c.host_only && c.enabled !== false);
    const allBtn = pending.length
      ? `<button class="act primary" data-up-all="${key}">Update All (${pending.length})</button>`
      : '';
    const body = list.length
      ? `<div class="updates-wrap"><table class="updates-table">
          <thead><tr>
            <th>Container</th><th>Channel</th><th>Tag</th>
            <th>Current digest</th><th>Latest digest</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>${rowHtml(list)}</tbody>
        </table></div>`
      : `<p style="color:var(--muted);font-size:.85rem">None in this group.</p>`;
    return `<div class="section" style="margin-top:1.25rem">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <h3 style="margin:0">${title}</h3>${allBtn}
      </div>${body}</div>`;
  };
  const apps = rows.filter(c => !c.core);
  $('#updates-body').innerHTML = apps.length
    ? section('Apps', apps, 'apps')
    : `<p style="color:var(--muted)">No updatable images in the active compose project.</p>`;

  if (state.updatesLog) {
    const rep = $('#rep');
    rep.style.display = 'block';
    rep.textContent = state.updatesLog;
  }

  const setProgress = (text, kind='ok') => {
    const bar = $('#updates-progress');
    if (!bar) return;
    state.updatesProgress = text ? { text, kind } : null;
    bar.style.display = text ? 'block' : 'none';
    bar.className = 'banner ' + (kind === 'bad' ? 'bad' : 'ok');
    if (kind === 'warn') {
      bar.className = 'banner';
      bar.style.borderColor = 'var(--warn)';
      bar.style.background = 'rgba(224,160,48,.12)';
    } else {
      bar.style.borderColor = '';
      bar.style.background = '';
    }
    bar.textContent = text || '';
  };
  if (state.updatesProgress) {
    setProgress(state.updatesProgress.text, state.updatesProgress.kind);
  }
  const setRowStatus = (id, kind, label, remoteDigest) => {
    const cell = document.querySelector(`[data-row-status="${id}"]`);
    const action = document.querySelector(`[data-row-action="${id}"]`);
    const local = document.querySelector(`[data-local-digest="${id}"]`);
    const cls = ({ok:'ok', warn:'warn', bad:'bad', busy:'busy'})[kind] || 'muted';
    if (cell) cell.innerHTML = `<span class="badge ${cls}">${label}</span>`;
    if (action) {
      if (kind === 'busy') action.innerHTML = '<span style="color:var(--muted);font-size:.8rem">working…</span>';
      else if (kind === 'ok') action.innerHTML = '';
      else if (kind === 'bad') action.innerHTML = `<button class="act primary" data-up="${id}">Retry</button>`;
    }
    if (kind === 'ok' && remoteDigest && local) local.textContent = fmtDigest(remoteDigest);
  };

  const applyOne = async (id, log) => {
    const started = Date.now();
    const tick = setInterval(() => {
      const secs = Math.round((Date.now() - started) / 1000);
      const action = document.querySelector(`[data-row-action="${id}"]`);
      if (action) action.innerHTML =
        `<span style="color:var(--muted);font-size:.8rem">working… ${secs}s</span>`;
    }, 1000);
    log.textContent += (log.textContent ? '\n' : '') +
      `→ ${id}: snapshotting, pulling and recreating…\n`;
    log.scrollTop = log.scrollHeight;
    try {
      const res = await api('/updates/' + id, {method:'POST'});
      log.textContent += res.rolled_back
        ? `ROLLED BACK ${id}\n${res.log}\n`
        : `OK ${id} (${Math.round((Date.now() - started) / 1000)}s)\n${res.log}\n`;
      log.scrollTop = log.scrollHeight;
      if (res.rolled_back || !res.ok) throw new Error(id + ' failed');
      return res;
    } catch (e) {
      log.textContent += `FAILED ${id}: ${e.message || e}\n`;
      log.scrollTop = log.scrollHeight;
      throw e;
    } finally {
      clearInterval(tick);
    }
  };

  // dockerproxy is host_only; disabled apps must not be started by apply
  // (`compose up -d <svc>` ignores COMPOSE_PROFILES when named explicitly).
  const applyable = (c) => c.update_available && !c.host_only && c.enabled !== false;

  const bindUpdateButtons = () => {
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => {
      const id = b.dataset.up;
      b.disabled = true;
      const rep = $('#rep');
      rep.style.display = 'block';
      setRowStatus(id, 'busy', 'updating…');
      setProgress(`Updating ${id}…`, 'warn');
      try {
        const row = rows.find(c => c.id === id);
        await applyOne(id, rep);
        setRowStatus(id, 'ok', 'current', row && row.remote_digest);
        setProgress(`Updated ${id}.`, 'ok');
        state.updatesLog = rep.textContent;
      } catch (e) {
        setRowStatus(id, 'bad', 'failed');
        setProgress(`Failed updating ${id}: ${e.message || e}`, 'bad');
        state.updatesLog = rep.textContent;
        bindUpdateButtons();
      }
    });
    document.querySelectorAll('[data-host-up]').forEach(b => b.onclick = () => {
      const id = b.dataset.hostUp;
      const rep = $('#rep');
      rep.style.display = 'block';
      const cmd = `cd ~/Docker/kine && sudo docker compose pull ${id} && sudo docker compose up -d ${id}`;
      rep.textContent =
        `${id} must be updated on the host — Helm talks to Docker through it,\n` +
        `so recreating it from here cuts that path mid-apply and leaves it down.\n\n` +
        `Run on osiris:\n  ${cmd}\n`;
      setProgress(`${id} is host-only — see the command in the log below.`, 'warn');
      state.updatesLog = rep.textContent;
    });
  };
  bindUpdateButtons();

  document.querySelectorAll('[data-up-all]').forEach(b => b.onclick = async () => {
    const group = apps;
    const pending = group.filter(applyable).map(c => c.id);
    if (!pending.length) return;
    document.querySelectorAll('[data-up], [data-up-all], #refresh').forEach(el => el.disabled = true);
    const rep = $('#rep');
    rep.style.display = 'block';
    rep.textContent = '';
    let done = 0;
    let failed = null;
    for (let i = 0; i < pending.length; i++) {
      const id = pending[i];
      const label = `${i + 1}/${pending.length}`;
      b.textContent = `Updating ${label}…`;
      setProgress(`Updating ${label}: ${id}…`, 'warn');
      setRowStatus(id, 'busy', 'updating…');
      try {
        const row = rows.find(c => c.id === id);
        await applyOne(id, rep);
        setRowStatus(id, 'ok', 'current', row && row.remote_digest);
        done += 1;
      } catch (e) {
        setRowStatus(id, 'bad', 'failed');
        failed = id;
        setProgress(
          `Stopped at ${label} (${id}): ${e.message || e}. ${done} succeeded before that.`,
          'bad'
        );
        break;
      }
    }
    state.updatesLog = rep.textContent;
    if (!failed) {
      b.textContent = `Done (${done}/${pending.length})`;
      const skipped = group.filter(c => c.update_available && c.host_only).map(c => c.id);
      setProgress(
        skipped.length
          ? `Finished ${done}/${pending.length} updates. Skipped host-only: ${skipped.join(', ')}.`
          : `Finished ${done}/${pending.length} updates.`,
        'ok'
      );
    }
    // Refresh from cache so digests/pending match disk, but keep the log.
    await render.updates(false);
  });
};

const promptVpnProfile = ({title, name='', conf='', submitLabel='Save'}={}) => new Promise((resolve) => {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal vpn-modal" role="dialog" aria-labelledby="vpn-modal-title">
      <h3 id="vpn-modal-title">${escHtml(title || 'VPN Profile')}</h3>
      <p>Paste a WireGuard client config, or load a <code>.conf</code> file.</p>
      <label for="vpn-profile-name">Name</label>
      <input id="vpn-profile-name" value="${escAttr(name)}" autocomplete="off">
      <label for="vpn-profile-conf">WireGuard Config</label>
      <textarea id="vpn-profile-conf" spellcheck="false">${escHtml(conf)}</textarea>
      <label for="vpn-profile-file">Load From File</label>
      <input id="vpn-profile-file" type="file" accept=".conf,text/plain">
      <p class="err" id="vpn-modal-err"></p>
      <div class="row" style="gap:.5rem;flex-wrap:wrap;margin-top:.75rem">
        <button type="button" class="act primary" id="vpn-modal-save">${escHtml(submitLabel)}</button>
        <button type="button" class="act" id="vpn-modal-cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const finish = (result) => { backdrop.remove(); resolve(result); };
  $('#vpn-profile-file', backdrop).onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      $('#vpn-profile-conf', backdrop).value = await file.text();
      if (!$('#vpn-profile-name', backdrop).value.trim()) {
        $('#vpn-profile-name', backdrop).value = file.name.replace(/\.conf$/i, '') || 'Profile';
      }
    } catch (err) {
      $('#vpn-modal-err', backdrop).textContent = err.message || String(err);
    }
  };
  $('#vpn-modal-cancel', backdrop).onclick = () => finish(null);
  $('#vpn-modal-save', backdrop).onclick = () => {
    const n = $('#vpn-profile-name', backdrop).value.trim();
    const c = $('#vpn-profile-conf', backdrop).value.trim();
    if (!n) {
      $('#vpn-modal-err', backdrop).textContent = 'Name is required.';
      return;
    }
    if (!c) {
      $('#vpn-modal-err', backdrop).textContent = 'WireGuard config is required.';
      return;
    }
    finish({name: n, conf: c});
  };
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) finish(null);
  });
});
