<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Centre</title>
<style>
:root{
  --bg:#1b1a19; --panel:#26241f; --panel-2:#302d27; --line:#3d3a33;
  --text:#f3f1ec; --muted:#a19c8f; --accent:#ff6a3d; --ok:#3fb950;
  --warn:#e0a030; --bad:#f85149; --radius:16px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f1ec;--panel:#fff;--panel-2:#f6f4ee;--line:#e5e0d5;
        --text:#22201b;--muted:#7a7568;}
}
*{box-sizing:border-box}
/* ponytail: a CSS gradient stands in for the reference's background
   photo — no image asset to embed, and a stock interior shot would
   just add dead weight to a single-file admin panel. */
body{margin:0;color:var(--text);
     font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
     background:
       radial-gradient(1100px 500px at 15% -10%, color-mix(in srgb, var(--accent) 35%, transparent), transparent),
       radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
       var(--bg);
     background-attachment:fixed}
header{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;
       border-bottom:1px solid var(--line);
       background:color-mix(in srgb, var(--panel) 65%, transparent);
       backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
header h1{font-size:1rem;margin:0;letter-spacing:.02em}
nav{display:flex;gap:.25rem;margin-left:auto}
nav button{background:none;border:1px solid transparent;color:var(--muted);
  padding:.5rem 1rem;border-radius:999px;cursor:pointer;font-size:.9rem}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:1.5rem;max-width:1100px;margin:0 auto}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:color-mix(in srgb, var(--panel) 80%, transparent);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      border:1px solid var(--line);border-radius:var(--radius);
      padding:1.1rem;display:flex;flex-direction:column;gap:.5rem}
.card h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.card p{margin:0;color:var(--muted);font-size:.85rem;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--line)}
.row{display:flex;gap:.5rem;align-items:center}
button.act{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  padding:.4rem .85rem;border-radius:999px;cursor:pointer;font-size:.8rem}
button.act:hover{border-color:var(--accent)}
button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
a.link{color:var(--accent);text-decoration:none;font-size:.8rem}
pre{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:.75rem;overflow:auto;font-size:.8rem;max-height:420px}
.section{margin-bottom:2rem}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:0 0 .75rem}
label{display:block;font-size:.8rem;color:var(--muted);margin:.75rem 0 .25rem}
input,select{width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);padding:.5rem;border-radius:6px;font:inherit}
.login{max-width:340px;margin:12vh auto}
.banner{padding:.6rem .9rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.banner.ok{background:rgba(63,185,80,.12);border:1px solid var(--ok)}
.banner.bad{background:rgba(248,81,73,.12);border:1px solid var(--bad)}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = async (path, opts={}) => {
  const r = await fetch('/api'+path, {credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, ...opts});
  if (r.status === 401) { render.login(); throw new Error('unauthenticated'); }
  return r.json();
};

const state = { tab:'apps', apps:[] };

const render = {};

render.shell = (body) => {
  $('#app').innerHTML = `
    <header>
      <h1>Media Centre</h1>
      <nav>
        ${['apps','updates','vpn','status','settings'].map(t =>
          `<button class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`
        ).join('')}
      </nav>
    </header>
    <main>${body}</main>`;
  document.querySelectorAll('nav button').forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; render[state.tab](); });
};


render.setup = () => {
  $('#app').innerHTML = `
    <main class="login" style="max-width:460px">
      <div class="card">
        <h3>First run</h3>
        <p>Set the admin password and how this appliance is reached. Both
           can be changed later from Settings.</p>
        <label>Admin password (12 characters minimum)</label>
        <input id="pw" type="password">
        <label>Confirm</label>
        <input id="pw2" type="password">
        <label>Domain</label>
        <input id="domain" value="media.lan">
        <label>Certificates</label>
        <select id="tls">
          <option value="internal">internal &mdash; Traefik's own CA, no domain needed</option>
          <option value="acme-dns">acme-dns &mdash; Let's Encrypt over DNS-01</option>
          <option value="custom">custom &mdash; supply your own PEM files</option>
        </select>
        <div id="acme" style="display:none">
          <label>ACME email</label><input id="email">
          <label>DNS provider code</label><input id="prov" value="cloudflare">
        </div>
        <label>Timezone</label><input id="tz" value="Europe/London">
        <div class="row" style="margin-top:1rem">
          <button class="act primary" id="go">Finish setup</button>
        </div>
        <div id="msg"></div>
      </div>
    </main>`;
  $('#tls').onchange = e => {
    $('#acme').style.display = e.target.value === 'acme-dns' ? 'block' : 'none';
  };
  $('#go').onclick = async () => {
    const pw = $('#pw').value;
    if (pw !== $('#pw2').value)
      return $('#msg').innerHTML = '<div class="banner bad">Passwords do not match</div>';
    if (pw.length < 12)
      return $('#msg').innerHTML = '<div class="banner bad">Needs at least 12 characters</div>';
    const r = await fetch('/api/setup', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({password:pw, domain:$('#domain').value,
        tls_mode:$('#tls').value, acme_email:$('#email')?.value||'',
        acme_provider:$('#prov')?.value||'', timezone:$('#tz').value})});
    if (r.ok) render.login();
    else {
      const e = await r.json();
      $('#msg').innerHTML = `<div class="banner bad">${e.detail||'setup failed'}</div>`;
    }
  };
};

render.login = () => {
  $('#app').innerHTML = `
    <main class="login">
      <div class="card">
        <h3>Sign in</h3>
        <label>Username</label><input id="u" value="admin">
        <label>Password</label><input id="p" type="password">
        <div class="row" style="margin-top:1rem">
          <button class="act primary" id="go">Sign in</button>
        </div>
        <div id="err"></div>
      </div>
    </main>`;
  $('#go').onclick = async () => {
    const r = await fetch('/api/auth/login', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:$('#u').value, password:$('#p').value})});
    if (r.ok) render.apps();
    else $('#err').innerHTML = '<div class="banner bad">Invalid credentials</div>';
  };
};

render.apps = async () => {
  state.apps = await api('/apps');
  const tiers = ['media','acquisition','live','platform'];
  const body = tiers.map(tier => {
    const items = state.apps.filter(a => a.tier===tier && !a.hidden);
    if (!items.length) return '';
    return `<div class="section"><h2>${tier}</h2><div class="grid">` +
      items.map(a => `
        <div class="card">
          <h3><span class="dot ${a.running?'on':'off'}"></span>${a.name}</h3>
          <p>${a.summary}</p>
          ${a.tunnelled==='forced'?'<p style="color:var(--warn)">Always tunnelled</p>':''}
          <div class="row">
            ${a.enabled
              ? `<button class="act" data-act="disable" data-id="${a.id}">Disable</button>
                 <button class="act" data-act="restart" data-id="${a.id}">Restart</button>`
              : `<button class="act primary" data-act="enable" data-id="${a.id}">Enable</button>`}
            ${a.url && a.enabled ? `<a class="link" href="${a.url}" target="_blank">Open</a>`:''}
          </div>
        </div>`).join('') + '</div></div>';
  }).join('');
  render.shell(body);
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'working...';
    await api(`/apps/${b.dataset.id}/${b.dataset.act}`, {method:'POST'});
    render.apps();
  });
};

render.updates = async (refresh=false) => {
  render.shell(`<div class="section"><h2>image updates</h2>
    <p style="color:var(--muted);font-size:.85rem">Nothing updates on its own.
    The overnight job only checks digests; applying an update snapshots
    config first and rolls back if the app does not come back healthy.</p>
    <div class="row" style="margin-bottom:1rem">
      <button class="act" id="refresh">Check now</button>
      <span id="age" style="color:var(--muted);font-size:.8rem"></span>
    </div>
    <pre id="rep">${refresh?'checking registries...':'loading...'}</pre>
    <div id="acts" class="row" style="margin-top:1rem"></div></div>`);
  $('#refresh').onclick = () => render.updates(true);
  const r = await api('/updates' + (refresh ? '?refresh=true' : ''));
  $('#rep').textContent = r.report || 'no report';
  $('#age').textContent = r.cached ? `cached, checked ${r.checked}` : 'just checked';
  $('#acts').innerHTML = (r.pending||[]).map(a =>
    `<button class="act primary" data-up="${a}">Update ${a}</button>`).join('');
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'updating...';
    const res = await api('/updates/'+b.dataset.up, {method:'POST'});
    $('#rep').textContent = res.log;
    if (res.rolled_back)
      $('#rep').textContent = 'ROLLED BACK\n\n' + res.log;
  });
};

render.vpn = async () => {
  const v = await api('/vpn');
  render.shell(`
    <div class="section"><h2>vpn</h2>
      <div class="card">
        <h3><span class="dot ${v.enabled?'on':'off'}"></span>${v.provider||'not set'}</h3>
        <p>Tunnelled: ${(v.tunnelled||[]).filter(Boolean).join(', ')||'none'}</p>
        <p>Forwarded port: ${v.forwarded_port||'none'}</p>
        <div class="row">
          <button class="act primary" id="leak">Run leak test</button>
          <button class="act" id="rst">Restart tunnel group</button>
        </div>
      </div>
      <pre id="out" style="margin-top:1rem"></pre>
    </div>`);
  $('#leak').onclick = async () => {
    $('#out').textContent = 'testing...';
    const r = await api('/vpn/leaktest', {method:'POST'});
    $('#out').textContent = r.detail;
  };
  $('#rst').onclick = async () => {
    $('#out').textContent = 'restarting the whole tunnel group...';
    const r = await api('/vpn/restart', {method:'POST'});
    $('#out').textContent = r.log;
  };
};


render.status = async () => {
  const s = await api('/status');
  const disk = (label, d) => d.error
    ? `<div class="card"><h3>${label}</h3><p>${d.path}</p><p style="color:var(--warn)">${d.error}</p></div>`
    : `<div class="card">
         <h3>${label}</h3><p>${d.path}</p>
         <p style="font-size:1.4rem;color:${d.used_pct>90?'var(--bad)':d.used_pct>75?'var(--warn)':'var(--text)'}">
           ${d.used_pct}% used</p>
         <p>${d.free_gb} GB free of ${d.total_gb} GB</p>
       </div>`;
  const jobs = s.jobs || {};
  const pending = (jobs.updates?.pending || []);
  render.shell(`
    <div class="section"><h2>storage</h2><div class="grid">
      ${disk('Stack', s.disks.stack)}${disk('Media and downloads', s.disks.data)}
    </div></div>
    <div class="section"><h2>background jobs</h2><div class="grid">
      <div class="card"><h3>Update check</h3>
        <p>Last run: ${jobs.updates?.checked || 'never'}</p>
        <p>${pending.length ? pending.length + ' app(s) with a newer image: ' + pending.join(', ')
                            : 'Everything is on its pinned image'}</p></div>
      <div class="card"><h3>Config backup</h3>
        <p>Last run: ${jobs.backup?.ran || 'never'}</p>
        <p>${jobs.backup?.path || 'no snapshot recorded'}</p></div>
    </div></div>
    ${Object.keys(jobs.errors||{}).length ? `<div class="banner bad">
      Job errors: ${Object.entries(jobs.errors).map(([k,v])=>k+': '+v).join(' | ')}</div>`:''}
  `);
};

render.settings = async () => {
  const s = await api('/settings');
  render.shell(`
    <div class="section"><h2>settings</h2><div class="card">
      <label>Domain</label><input id="MC_DOMAIN" value="${s.MC_DOMAIN}">
      <label>TLS mode</label>
      <select id="MC_TLS_MODE">
        ${['internal','acme-dns','custom'].map(m =>
          `<option ${s.MC_TLS_MODE===m?'selected':''}>${m}</option>`).join('')}
      </select>
      <label>ACME email (acme-dns only)</label>
      <input id="MC_ACME_EMAIL" value="${s.MC_ACME_EMAIL}">
      <label>ACME DNS provider</label>
      <input id="MC_ACME_DNS_PROVIDER" value="${s.MC_ACME_DNS_PROVIDER}">
      <label>Timezone</label><input id="MC_TIMEZONE" value="${s.MC_TIMEZONE}">
      <div class="row" style="margin-top:1rem">
        <button class="act primary" id="save">Save and reload Traefik</button>
        <button class="act" id="bk">Back up now</button>
      </div>
      <div id="msg"></div>
    </div></div>`);
  $('#save').onclick = async () => {
    const keys = ['MC_DOMAIN','MC_TLS_MODE','MC_ACME_EMAIL','MC_ACME_DNS_PROVIDER','MC_TIMEZONE'];
    await api('/settings', {method:'POST',
      body: JSON.stringify(Object.fromEntries(keys.map(k=>[k,$('#'+k).value])))});
    $('#msg').innerHTML = '<div class="banner ok">Saved. Certificates may take a minute.</div>';
  };
  $('#bk').onclick = async () => {
    const r = await api('/backup', {method:'POST'});
    $('#msg').innerHTML = `<div class="banner ok">Backup: ${r.path}</div>`;
  };
};

(async () => {
  const h = await (await fetch('/api/health')).json();
  if (!h.configured) return render.setup();
  render.apps().catch(() => render.login());
})();
</script>
</body>
</html>
