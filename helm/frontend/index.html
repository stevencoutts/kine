<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kine</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#18191b; --panel:#242628; --panel-2:#2e3134; --line:#3e4248;
  --text:#eef0f2; --muted:#9aa0a8; --accent:#8a8f98; --accent-strong:#c4c8ce;
  --ok:#3fb950; --warn:#e0a030; --bad:#f85149; --radius:16px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#eceef0;--panel:#fff;--panel-2:#f4f5f6;--line:#d5d8dc;
        --text:#1c1e21;--muted:#6b7280;--accent:#6b7280;--accent-strong:#374151;}
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
     font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
     background:
       radial-gradient(1100px 500px at 15% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent),
       radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent),
       var(--bg);
     background-attachment:fixed}
header{display:flex;align-items:center;gap:.85rem;padding:1rem 1.5rem;
       border-bottom:1px solid var(--line);
       background:color-mix(in srgb, var(--panel) 65%, transparent);
       backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:.65rem}
.brand-mark{width:28px;height:28px;flex:none;display:block}
header h1{font-size:1.05rem;margin:0;letter-spacing:.04em;font-weight:600;
  color:var(--accent-strong)}
nav{display:flex;gap:.25rem;margin-left:auto}
nav button{background:color-mix(in srgb, var(--panel) 50%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid color-mix(in srgb, var(--line) 60%, transparent);
  color:var(--muted);padding:.5rem 1rem;border-radius:999px;cursor:pointer;font-size:.9rem}
nav button.active{background:color-mix(in srgb, var(--accent) 85%, transparent);
  color:#fff;border-color:color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow:0 2px 12px color-mix(in srgb, var(--accent) 25%, transparent)}
main{padding:1.5rem;padding-bottom:4rem;max-width:1100px;margin:0 auto}
footer#vpnbar{position:fixed;left:0;right:0;bottom:0;z-index:10;
  display:flex;align-items:center;gap:.5rem;padding:.6rem 1.5rem;
  background:color-mix(in srgb, var(--panel) 70%, transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
footer#vpnbar b{color:var(--text)}
footer#vpnbar .dot.on{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:color-mix(in srgb, var(--panel) 52%, transparent);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border:1px solid color-mix(in srgb, var(--line) 55%, transparent);
      border-radius:var(--radius);box-shadow:0 4px 24px color-mix(in srgb, #000 6%, transparent);
      padding:1.1rem;display:flex;flex-direction:column;gap:.5rem}
.card h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:.5rem}
.card p{margin:0;color:var(--muted);font-size:.85rem;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)} .dot.off{background:var(--line)}
.row{display:flex;gap:.5rem;align-items:center}
button.act{background:color-mix(in srgb, var(--panel-2) 65%, transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  color:var(--text);padding:.4rem .85rem;border-radius:999px;cursor:pointer;font-size:.8rem}
button.act:hover{border-color:var(--accent-strong)}
button.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.act.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#18191b}
a.link{color:var(--accent-strong);text-decoration:none;font-size:.8rem}
pre{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:.75rem;overflow:auto;font-size:.8rem;max-height:420px}
.section{margin-bottom:2rem}
.section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin:0 0 .75rem}
.overview-bar{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1.25rem}
.overview-btn{flex:1;min-width:150px;position:relative;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;align-items:stretch;
  background:color-mix(in srgb, var(--panel) 48%, transparent);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid color-mix(in srgb, var(--line) 50%, transparent);
  border-radius:var(--radius);padding:.85rem 1rem 1rem;
  box-shadow:0 4px 20px color-mix(in srgb, #000 5%, transparent);
  transition:border-color .15s,box-shadow .15s,background .15s}
.overview-btn:hover{border-color:color-mix(in srgb, var(--accent) 45%, transparent)}
.overview-btn.active{border-color:color-mix(in srgb, var(--accent) 65%, transparent);
  background:color-mix(in srgb, var(--accent) 14%, transparent);
  box-shadow:0 6px 28px color-mix(in srgb, var(--accent) 18%, transparent)}
.overview-btn.off-tier{opacity:.72}
.overview-btn.watching-live{
  border-color:color-mix(in srgb, var(--ok) 55%, transparent);
  background:color-mix(in srgb, var(--ok) 16%, transparent);
  box-shadow:0 4px 20px color-mix(in srgb, var(--ok) 18%, transparent)}
.overview-btn.watching-live.active{
  border-color:color-mix(in srgb, var(--ok) 70%, transparent);
  background:color-mix(in srgb, var(--ok) 22%, transparent);
  box-shadow:0 6px 28px color-mix(in srgb, var(--ok) 22%, transparent)}
.overview-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  margin-bottom:.45rem;min-height:1.35rem}
.overview-btn h2{margin:0;font-size:.72rem;line-height:1.35rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left}
.overview-spacer{visibility:hidden;pointer-events:none}
.overview-stat{font-size:1.15rem;font-weight:600;line-height:1.2}
.overview-stat span{color:var(--muted);font-weight:400;font-size:.82rem}
.watch-list{display:flex;flex-direction:column;gap:.75rem}
.watch-row{padding:.15rem 0}
.watch-row strong{display:block;font-size:.95rem}
.watch-row .watch-sub{color:var(--muted);font-size:.8rem}
.watch-bar{height:4px;margin-top:.45rem;border-radius:999px;
  background:color-mix(in srgb, var(--line) 70%, transparent);overflow:hidden}
.watch-bar i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.tier-switch{position:relative;display:inline-flex;align-items:center;flex:none;cursor:pointer}
.tier-switch input{position:absolute;opacity:0;width:0;height:0;margin:0}
.tier-switch-ui{display:inline-flex;align-items:center;width:2.6rem;height:1.35rem;
  border-radius:999px;padding:2px;
  background:color-mix(in srgb, var(--panel-2) 70%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  box-shadow:inset 0 1px 3px color-mix(in srgb, #000 12%, transparent);
  transition:background .18s,border-color .18s,box-shadow .18s}
.tier-switch-ui::before{content:"";width:1.05rem;height:1.05rem;border-radius:50%;
  background:color-mix(in srgb, var(--panel) 90%, transparent);
  border:1px solid color-mix(in srgb, var(--line) 50%, transparent);
  box-shadow:0 1px 4px color-mix(in srgb, #000 18%, transparent);
  transition:transform .18s,background .18s,border-color .18s}
.tier-switch input:checked + .tier-switch-ui{
  background:color-mix(in srgb, var(--ok) 55%, transparent);
  border-color:color-mix(in srgb, var(--ok) 45%, transparent);
  box-shadow:0 0 12px color-mix(in srgb, var(--ok) 28%, transparent),
    inset 0 1px 2px color-mix(in srgb, #fff 12%, transparent)}
.tier-switch input:checked + .tier-switch-ui::before{
  transform:translateX(1.2rem);
  background:#fff;border-color:transparent}
.tier-switch input:focus-visible + .tier-switch-ui{
  outline:2px solid color-mix(in srgb, var(--accent) 60%, transparent);outline-offset:2px}
.tier-switch input:disabled + .tier-switch-ui{opacity:.55;cursor:wait}
.tier-switch > span:not(.tier-switch-ui){user-select:none}
.apps-panel{background:color-mix(in srgb, var(--panel) 38%, transparent);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid color-mix(in srgb, var(--line) 45%, transparent);
  border-radius:var(--radius);padding:1.25rem;
  box-shadow:0 8px 32px color-mix(in srgb, #000 7%, transparent)}
label{display:block;font-size:.8rem;color:var(--muted);margin:.75rem 0 .25rem}
input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
  color:var(--text);padding:.5rem;border-radius:6px;font:inherit}
textarea{font-family:ui-monospace,monospace;font-size:.8rem;resize:vertical}
.login{max-width:340px;margin:12vh auto}
.banner{padding:.6rem .9rem;border-radius:var(--radius);font-size:.85rem;margin-bottom:1rem}
.banner.ok{background:rgba(63,185,80,.12);border:1px solid var(--ok)}
.banner.bad{background:rgba(248,81,73,.12);border:1px solid var(--bad)}
.nfs-role-row{display:grid;grid-template-columns:9rem 1fr;gap:.5rem .75rem;
  align-items:center;margin:.35rem 0}
.nfs-role-row label{margin:0}
.nfs-shares{margin:.75rem 0;padding:.75rem;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--panel-2)}
.nfs-shares p{margin:0 0 .5rem;color:var(--muted);font-size:.8rem}
.nfs-shares ul{margin:0;padding:0;list-style:none;font-size:.8rem}
.nfs-shares li{padding:.2rem 0;color:var(--text);word-break:break-all}
.nfs-shares li span{color:var(--muted)}
.updates-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.82rem}
.updates-table th,.updates-table td{padding:.55rem .65rem;text-align:left;border-bottom:1px solid var(--line)}
.updates-table th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.updates-table tr:last-child td{border-bottom:none}
.updates-table td.mono{font-family:ui-monospace,monospace;font-size:.78rem}
.updates-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
  background:color-mix(in srgb, var(--panel) 52%, transparent)}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:999px;font-size:.72rem;font-weight:600}
.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.badge.warn{background:rgba(224,160,48,.15);color:var(--warn)}
.badge.muted{background:color-mix(in srgb, var(--panel-2) 80%, transparent);color:var(--muted)}
.badge.dev{background:rgba(100,149,237,.15);color:#7eb6ff}
@media (prefers-color-scheme: light){.badge.dev{color:#2563eb}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = async (path, opts={}) => {
  const r = await fetch('/api'+path, {credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, ...opts});
  if (r.status === 401) { render.login(); throw new Error('Unauthenticated'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || 'Request failed');
  return data;
};

const state = { tab:'apps', apps:[], tiers:{}, activeTier:null, watchTimer:null };
const escHtml = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
const TAB_LABELS = {apps:'Apps', updates:'Updates', vpn:'VPN', status:'Status', settings:'Settings'};
const TIER_ORDER = ['media','acquisition','process','live','platform'];

// window.open(..., 'noopener') returns null on success in modern browsers,
// so set opener manually and fall back to same-tab when a pop-up is blocked.
const launchApp = (app) => {
  const tierMsg = $('#tier-msg');
  const name = app?.name || 'application';
  if (!app?.url) {
    tierMsg.className = 'banner bad';
    tierMsg.textContent = `Could not open ${name}. No launch URL is configured.`;
    return;
  }
  const w = window.open(app.url, '_blank');
  if (w) {
    w.opener = null;
    return;
  }
  try {
    window.location.assign(app.url);
    return;
  } catch (_) {}
  tierMsg.className = 'banner bad';
  tierMsg.innerHTML =
    `Could not open ${name}. Copy this URL into a new tab: ` +
    `<a class="link" href="${app.url}" target="_blank" rel="noopener noreferrer">${app.url}</a>`;
};

const render = {};

render.shell = (body) => {
  if (state.watchTimer && state.tab !== 'apps') {
    clearInterval(state.watchTimer);
    state.watchTimer = null;
  }
  $('#app').innerHTML = `
    <header>
      <div class="brand">
        <img class="brand-mark" src="/assets/favicon.svg" alt="" width="28" height="28">
        <h1>Kine</h1>
      </div>
      <nav>
        ${['apps','updates','vpn','status','settings'].map(t =>
          `<button class="${state.tab===t?'active':''}" data-tab="${t}">${TAB_LABELS[t]}</button>`
        ).join('')}
      </nav>
    </header>
    <main>${body}</main>
    <footer id="vpnbar"><span class="dot off"></span>checking VPN&hellip;</footer>`;
  document.querySelectorAll('nav button').forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; render[state.tab](); });
  updateVpnBar();
};

// Refreshed on every tab switch (render.shell) plus on a timer, so the
// tunnel and public IP stay visible no matter which tab is open.
const updateVpnBar = async () => {
  const bar = $('#vpnbar');
  if (!bar) return;
  try {
    const v = await api('/vpn');
    if (!v.enabled) { bar.innerHTML = '<span class="dot off"></span>VPN Disabled'; return; }
    const up = !!v.public_ip;
    bar.innerHTML = `<span class="dot ${up ? 'on' : 'off'}"></span>` +
      (up ? `Tunnel up via ${v.connection_type || 'VPN'} &mdash; public IP <b>${v.public_ip}</b>`
          : `Tunnel status unknown &mdash; ${v.connection_type || 'VPN'}`);
  } catch (e) { /* not signed in yet, or the request failed; leave it as-is */ }
};
setInterval(updateVpnBar, 30000);


render.setup = () => {
  $('#app').innerHTML = `
    <main class="login" style="max-width:460px">
      <div class="brand" style="justify-content:center;margin-bottom:1rem">
        <img class="brand-mark" src="/assets/favicon.svg" alt="" width="36" height="36">
        <h1>Kine</h1>
      </div>
      <div class="card">
        <h3>First Run</h3>
        <p>Set the admin password and how this appliance is reached. Both
           can be changed later from Settings.</p>
        <label>Admin Password (12 Characters Minimum)</label>
        <input id="pw" type="password">
        <label>Confirm</label>
        <input id="pw2" type="password">
        <label>Domain (advertised automatically on the LAN via mDNS if it ends in .local)</label>
        <input id="domain" value="kine.local">
        <label>Certificates</label>
        <select id="tls">
          <option value="internal">internal &mdash; Traefik's own CA, no domain needed</option>
          <option value="acme-dns">acme-dns &mdash; Let's Encrypt over DNS-01</option>
          <option value="custom">custom &mdash; supply your own PEM files</option>
        </select>
        <div id="acme" style="display:none">
          <label>ACME Email</label><input id="email">
          <label>DNS Provider Code</label><input id="prov" value="cloudflare">
        </div>
        <label>Timezone</label><input id="tz" value="Europe/London">
        <label class="row" style="margin-top:.75rem">
          <input id="vpn_enable" type="checkbox" style="width:auto">
          Enable VPN (tunnels the whole acquisition tier)
        </label>
        <div id="vpn_conf_wrap" style="display:none">
          <label>WireGuard Config File</label>
          <input id="vpn_conf" type="file" accept=".conf,.txt">
          <label>&hellip;Or Paste It Here</label>
          <textarea id="vpn_conf_text" rows="5" placeholder="[Interface]&#10;PrivateKey = ...&#10;Address = ..."></textarea>
        </div>
        <div class="row" style="margin-top:1rem">
          <button class="act primary" id="go">Finish Setup</button>
        </div>
        <div id="msg"></div>
      </div>
    </main>`;
  $('#tls').onchange = e => {
    $('#acme').style.display = e.target.value === 'acme-dns' ? 'block' : 'none';
  };
  $('#vpn_enable').onchange = e => {
    $('#vpn_conf_wrap').style.display = e.target.checked ? 'block' : 'none';
  };
  $('#go').onclick = async () => {
    const pw = $('#pw').value;
    if (pw !== $('#pw2').value)
      return $('#msg').innerHTML = '<div class="banner bad">Passwords do not match</div>';
    if (pw.length < 12)
      return $('#msg').innerHTML = '<div class="banner bad">Needs at least 12 characters</div>';
    const vpnEnabled = $('#vpn_enable').checked;
    const vpnFile = $('#vpn_conf').files[0];
    const wireguardConf = vpnEnabled
      ? (vpnFile ? await vpnFile.text() : $('#vpn_conf_text').value)
      : '';
    if (vpnEnabled && !wireguardConf.trim())
      return $('#msg').innerHTML = '<div class="banner bad">VPN is enabled: provide a WireGuard config file or paste one in</div>';
    const btn = $('#go');
    btn.disabled = true;
    $('#msg').innerHTML = vpnEnabled
      ? '<div class="banner">Setting up&hellip; starting VPN (may take a minute).</div>'
      : '<div class="banner">Setting up&hellip;</div>';
    try {
      const r = await fetch('/api/setup', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({password:pw, domain:$('#domain').value,
          tls_mode:$('#tls').value, acme_email:$('#email')?.value||'',
          acme_provider:$('#prov')?.value||'', timezone:$('#tz').value,
          vpn_enabled:vpnEnabled, wireguard_conf:wireguardConf})});
      if (r.ok) render.login();
      else {
        let detail = 'setup failed';
        try {
          const e = await r.json();
          detail = e.detail || detail;
        } catch (_) {
          detail = `${r.status} ${r.statusText}`.trim();
        }
        $('#msg').innerHTML = `<div class="banner bad">${detail}</div>`;
      }
    } catch (e) {
      $('#msg').innerHTML = `<div class="banner bad">${e.message||'setup failed'}</div>`;
    } finally {
      btn.disabled = false;
    }
  };
};

render.login = () => {
  $('#app').innerHTML = `
    <main class="login">
      <div class="brand" style="justify-content:center;margin-bottom:1rem">
        <img class="brand-mark" src="/assets/favicon.svg" alt="" width="36" height="36">
        <h1>Kine</h1>
      </div>
      <div class="card">
        <h3>Sign In</h3>
        <label>Username</label><input id="u" value="admin">
        <label>Password</label><input id="p" type="password">
        <div class="row" style="margin-top:1rem">
          <button class="act primary" id="go">Sign In</button>
        </div>
        <div id="err"></div>
      </div>
    </main>`;
  $('#go').onclick = async () => {
    const r = await fetch('/api/auth/login', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:$('#u').value, password:$('#p').value})});
    if (r.ok) render.apps();
    else $('#err').innerHTML = '<div class="banner bad">Invalid credentials</div>';
  };
};

const tierStats = items => {
  const enabled = items.filter(a => a.enabled);
  return { running: enabled.filter(a => a.running).length, total: enabled.length };
};
const watchPanel = (w) => {
  const configured = w.configured || {};
  if (!configured.plex && !configured.emby) {
    return '<p style="color:var(--muted);margin:0">Add Plex or Emby credentials in Settings to see what is playing.</p>';
  }
  const sessions = w.sessions || [];
  const errors = Object.entries(w.errors || {}).map(([k,v]) => `${k}: ${v}`).join(' · ');
  if (!sessions.length) {
    return `<p style="color:var(--muted);margin:0">Nothing is playing right now.</p>
      ${errors ? `<p style="color:var(--warn);font-size:.8rem;margin:.5rem 0 0">${escHtml(errors)}</p>` : ''}`;
  }
  const rows = sessions.map(s => {
    const server = s.server === 'plex' ? 'Plex' : 'Emby';
    const st = s.state === 'paused' ? 'paused' : 'playing';
    const pct = s.progress == null ? '' : ` · ${s.progress}%`;
    const bar = s.progress == null ? '' : `<div class="watch-bar"><i style="width:${s.progress}%"></i></div>`;
    return `<div class="watch-row">
      <strong>${escHtml(s.title)}</strong>
      <div class="watch-sub">${escHtml(s.user)} · ${escHtml(s.player)} · ${server} · ${st}${pct}</div>
      ${bar}
    </div>`;
  }).join('');
  return `<div class="watch-list">${rows}</div>
    ${errors ? `<p style="color:var(--warn);font-size:.8rem;margin:.75rem 0 0">${escHtml(errors)}</p>` : ''}`;
};
const appCard = a => `
  <div class="card">
    <h3><span class="dot ${a.running?'on':'off'}"></span>${a.name}</h3>
    <p>${a.summary}</p>
    ${a.tunnelled==='forced'?'<p style="color:var(--warn)">Always Tunnelled</p>':''}
    ${a.dev_supported ? `<label class="tier-switch" style="margin:.15rem 0" aria-label="Dev Version">
      <input type="checkbox" data-dev="${a.id}" ${a.dev_enabled?'checked':''}>
      <span class="tier-switch-ui" aria-hidden="true"></span>
      <span style="margin-left:.55rem;font-size:.8rem;color:var(--muted)">Dev Version${a.dev_enabled && a.dev_tag ? ` (${a.dev_tag})` : ''}</span>
    </label>` : ''}
    <div class="row">
      ${a.enabled
        ? `<button class="act" data-act="disable" data-id="${a.id}">Disable</button>
           <button class="act" data-act="restart" data-id="${a.id}">Restart</button>`
        : `<button class="act primary" data-act="enable" data-id="${a.id}">Enable</button>`}
      ${a.url && a.enabled ? `<button class="act" data-open="${a.id}">Open</button>`:''}
    </div>
  </div>`;

render.apps = async () => {
  if (state.watchTimer) { clearInterval(state.watchTimer); state.watchTimer = null; }
  const [data, watch] = await Promise.all([
    api('/apps'),
    api('/watching').catch(() => ({count:0, sessions:[], configured:{}, errors:{}})),
  ]);
  state.apps = data.apps;
  state.tiers = data.tiers;
  const visibleTiers = TIER_ORDER.filter(tier => {
    const meta = state.tiers[tier];
    return meta && state.apps.some(a => a.tier === tier && !a.hidden);
  });
  if (state.activeTier !== 'watching' && !visibleTiers.includes(state.activeTier))
    state.activeTier = visibleTiers.find(t => state.tiers[t]?.enabled) || visibleTiers[0] || null;
  const watchingActive = state.activeTier === 'watching';
  const watchCount = watch.count || 0;
  const watchBtn = `<div class="overview-btn ${watchingActive?'active':''}${watchCount?' watching-live':''}"
      data-overview="watching" role="button" tabindex="0" aria-pressed="${watchingActive}">
      <div class="overview-top">
        <h2>Watching</h2>
        <span class="tier-switch overview-spacer" aria-hidden="true">
          <span class="tier-switch-ui"></span>
        </span>
      </div>
      <div class="overview-stat">${watchCount}<span> ${watchCount===1?'session':'sessions'}</span></div>
    </div>`;
  const overview = visibleTiers.map(tier => {
    const meta = state.tiers[tier];
    const stats = tierStats(state.apps.filter(a => a.tier === tier && !a.hidden));
    const active = state.activeTier === tier;
    return `<div class="overview-btn ${active?'active':''} ${!meta.enabled?'off-tier':''}"
      data-overview="${tier}" role="button" tabindex="0" aria-pressed="${active}">
      <div class="overview-top">
        <h2>${meta.label}</h2>
        <label class="tier-switch" aria-label="${meta.enabled?'Disable':'Enable'} ${meta.label}">
          <input type="checkbox" data-tier="${tier}" ${meta.enabled?'checked':''}>
          <span class="tier-switch-ui" aria-hidden="true"></span>
        </label>
      </div>
      <div class="overview-stat">${stats.running}<span> / ${stats.total} running</span></div>
    </div>`;
  }).join('');
  const activeItems = (!watchingActive && state.activeTier)
    ? state.apps.filter(a => a.tier === state.activeTier && !a.hidden) : [];
  const panel = watchingActive
    ? `<div id="watch-panel">${watchPanel(watch)}</div>`
    : (activeItems.length
      ? `<div class="grid">${activeItems.map(appCard).join('')}</div>`
      : '<p style="color:var(--muted);margin:0">No apps in this group.</p>');
  const body = `<div id="tier-msg"></div>
    <div class="overview-bar">${watchBtn}${overview}</div>
    <div class="apps-panel">${panel}</div>`;
  render.shell(body);
  if (watchingActive) {
    state.watchTimer = setInterval(async () => {
      const next = await api('/watching').catch(() => null);
      if (!next || state.activeTier !== 'watching') return;
      const box = $('#watch-panel');
      if (box) box.innerHTML = watchPanel(next);
      const btn = document.querySelector('[data-overview="watching"]');
      const stat = btn && btn.querySelector('.overview-stat');
      if (stat) stat.innerHTML = `${next.count||0}<span> ${(next.count||0)===1?'session':'sessions'}</span>`;
      if (btn) btn.classList.toggle('watching-live', !!(next.count||0));
    }, 15000);
  }
  document.querySelectorAll('[data-overview]').forEach(el => {
    const pick = () => { state.activeTier = el.dataset.overview; render.apps(); };
    el.onclick = pick;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
  });
  document.querySelectorAll('[data-tier]').forEach(el => {
    el.onchange = async () => {
      el.disabled = true;
      try {
        await api(`/tiers/${el.dataset.tier}/${el.checked?'enable':'disable'}`, {method:'POST'});
        if (el.checked) state.activeTier = el.dataset.tier;
        render.apps();
      } catch (e) {
        el.checked = !el.checked;
        const tierMsg = $('#tier-msg');
        tierMsg.className = 'banner bad';
        tierMsg.textContent = e.message || 'Could not update section';
        el.disabled = false;
      }
    };
    el.onclick = e => e.stopPropagation();
  });
  document.querySelectorAll('[data-dev]').forEach(el => {
    el.onchange = async () => {
      el.disabled = true;
      try {
        await api(`/apps/${el.dataset.dev}/dev/${el.checked?'enable':'disable'}`, {method:'POST'});
        render.apps();
      } catch (e) {
        el.checked = !el.checked;
        const tierMsg = $('#tier-msg');
        tierMsg.className = 'banner bad';
        tierMsg.textContent = e.message || 'Could not update image channel';
        el.disabled = false;
      }
    };
  });
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'Working...';
    await api(`/apps/${b.dataset.id}/${b.dataset.act}`, {method:'POST'});
    render.apps();
  });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    launchApp(state.apps.find(a => a.id === b.dataset.open));
  });
};

render.updates = async (refresh=false) => {
  render.shell(`<div class="section"><h2>Image Updates</h2>
    <p style="color:var(--muted);font-size:.85rem">Nothing updates on its own.
    The overnight job only checks digests; applying an update snapshots
    config first and rolls back if the app does not come back healthy.</p>
    <div class="row" style="margin-bottom:1rem">
      <button class="act" id="refresh">Check Now</button>
      <span id="age" style="color:var(--muted);font-size:.8rem"></span>
    </div>
    <div class="updates-wrap"><table class="updates-table">
      <thead><tr>
        <th>Container</th><th>Channel</th><th>Tag</th>
        <th>Current digest</th><th>Latest digest</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7" style="color:var(--muted)">${
        refresh ? 'checking registries…' : 'loading…'
      }</td></tr></tbody>
    </table></div>
    <pre id="rep" style="margin-top:1rem;display:none"></pre></div>`);
  $('#refresh').onclick = () => render.updates(true);
  const r = await api('/updates' + (refresh ? '?refresh=true' : ''));
  const rows = r.containers || [];
  $('#age').textContent = r.cached ? `cached, checked ${r.checked || 'unknown'}` : 'just checked';
  const fmtDigest = d => (!d || d === 'none' || d === '?') ? '—' : d;
  const rowHtml = rows.map(c => {
    const ch = c.channel === 'dev'
      ? `<span class="badge dev">dev</span>`
      : `<span class="badge muted">prod</span>`;
    const tag = c.configured_tag || c.tag || 'latest';
    const stable = c.stable_tag ? `<span style="color:var(--muted);font-size:.75rem"> ← ${c.stable_tag}</span>` : '';
    const st = c.update_available
      ? `<span class="badge warn">update</span>`
      : `<span class="badge ok">current</span>`;
    const run = c.running ? '' : ' <span style="color:var(--muted)">(stopped)</span>';
    const btn = c.update_available
      ? `<button class="act primary" data-up="${c.id}">Update</button>` : '';
    return `<tr>
      <td><strong>${c.name || c.id}</strong><span style="color:var(--muted)">${run}</span></td>
      <td>${ch}</td>
      <td class="mono">${tag}${stable}</td>
      <td class="mono">${fmtDigest(c.local_digest)}</td>
      <td class="mono">${fmtDigest(c.remote_digest)}</td>
      <td>${st}</td>
      <td>${btn}</td>
    </tr>`;
  }).join('');
  $('#rows').innerHTML = rowHtml || `<tr><td colspan="7" style="color:var(--muted)">No updatable images in the active compose project.</td></tr>`;
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'updating…';
    const rep = $('#rep');
    rep.style.display = 'block';
    rep.textContent = 'snapshotting config, then pulling and recreating ' + b.dataset.up + '…\n(this can take a minute; progress appears when the job finishes)';
    try {
      const res = await api('/updates/'+b.dataset.up, {method:'POST'});
      rep.textContent = res.rolled_back ? 'ROLLED BACK\n\n' + res.log : res.log;
      render.updates(true);
    } catch (e) {
      rep.textContent = e.message;
    }
  });
};

render.vpn = async () => {
  const v = await api('/vpn');
  render.shell(`
    <div class="section"><h2>VPN</h2>
      <div class="card">
        <h3><span class="dot ${v.enabled?'on':'off'}"></span>${v.connection_type||'VPN'}</h3>
        <p>Tunnelled: ${(v.tunnelled||[]).filter(Boolean).join(', ')||'none'}</p>
        <p>Forwarded port: ${v.forwarded_port||'none'}</p>
        <p>Public IP: ${v.public_ip||'unknown'}</p>
        <div class="row">
          <button class="act primary" id="leak">Run Leak Test</button>
          <button class="act" id="rst">Restart Tunnel Group</button>
        </div>
      </div>
      <pre id="out" style="margin-top:1rem"></pre>
    </div>`);
  $('#leak').onclick = async () => {
    $('#out').textContent = 'testing...';
    const r = await api('/vpn/leaktest', {method:'POST'});
    $('#out').textContent = r.detail;
  };
  $('#rst').onclick = async () => {
    $('#out').textContent = 'restarting the whole tunnel group...';
    const r = await api('/vpn/restart', {method:'POST'});
    $('#out').textContent = r.log;
  };
};


render.status = async () => {
  const s = await api('/status');
  const disk = (label, d) => d.error
    ? `<div class="card"><h3>${label}</h3><p>${d.path}</p><p style="color:var(--warn)">${d.error}</p></div>`
    : `<div class="card">
         <h3>${label}</h3><p>${d.path}</p>
         <p style="font-size:1.4rem;color:${d.used_pct>90?'var(--bad)':d.used_pct>75?'var(--warn)':'var(--text)'}">
           ${d.used_pct}% used</p>
         <p>${d.free_gb} GB free of ${d.total_gb} GB</p>
       </div>`;
  const jobs = s.jobs || {};
  const pending = (jobs.updates?.pending || []);
  render.shell(`
    <div class="section"><h2>Storage</h2><div class="grid">
      ${disk('Stack', s.disks.stack)}${disk('Media and downloads', s.disks.data)}
    </div></div>
    <div class="section"><h2>Background Jobs</h2><div class="grid">
      <div class="card"><h3>Update Check</h3>
        <p>Last run: ${jobs.updates?.checked || 'never'}</p>
        <p>${pending.length ? pending.length + ' app(s) with a newer image: ' + pending.join(', ')
                            : 'Everything is on its pinned image'}</p></div>
      <div class="card"><h3>Config Backup</h3>
        <p>Last run: ${jobs.backup?.ran || 'never'}</p>
        <p>${jobs.backup?.path || 'no snapshot recorded'}</p></div>
    </div></div>
    ${Object.keys(jobs.errors||{}).length ? `<div class="banner bad">
      Job errors: ${Object.entries(jobs.errors).map(([k,v])=>k+': '+v).join(' | ')}</div>`:''}
  `);
};

render.settings = async () => {
  const s = await api('/settings');
  const nfsPrimary = [
    ['NFS_MEDIA', 'Media library'],
    ['NFS_DOWNLOADS', 'Downloads'],
    ['NFS_CACHE', 'Tdarr cache'],
  ];
  const nfsAdvanced = [
    ['NFS_TV', 'TV share'],
    ['NFS_MOVIES', 'Movies share'],
  ];
  const nfsAll = [...nfsPrimary, ...nfsAdvanced];
  const nfsAdvancedIds = new Set(nfsAdvanced.map(([id]) => id));
  const nfsState = { exports: [], labels: {}, suggestions: {}, mediaSubfolders: [] };
  const esc = (v) => String(v || '').replace(/"/g, '&quot;');
  const embySsl = s.EMBY_USE_SSL === 'true';
  const embyHost = s.EMBY_HOST || s.EMBY_DEFAULT_HOST || '';
  const embyPort = s.EMBY_PORT || (embySsl ? '443' : '8096');
  const plexSsl = s.PLEX_USE_SSL === 'true';
  const plexPort = s.PLEX_PORT || (plexSsl ? '443' : '32400');
  const mediaPortFor = (ssl, current, sslPort, plainPort) => {
    const p = String(current || '').trim();
    if (p && !(ssl && p === String(plainPort)) && !(!ssl && p === String(sslPort))) return p;
    return ssl ? String(sslPort) : String(plainPort);
  };
  const bindMediaPortToggle = (sslId, portId, sslPort, plainPort) => {
    const sslEl = $('#'+sslId);
    const portEl = $('#'+portId);
    if (!sslEl || !portEl) return;
    sslEl.onchange = () => {
      const p = portEl.value.trim();
      if (!p || p === String(plainPort) || p === String(sslPort))
        portEl.value = sslEl.checked ? sslPort : plainPort;
    };
  };
  const nfsRoleRow = ([id, label]) => `
    <div class="nfs-role-row">
      <label for="${id}">${label}</label>
      <select id="${id}" data-nfs-select>
        <option value="">— not used —</option>
        ${s[id] ? `<option value="${esc(s[id])}" selected>${esc(s[id])}</option>` : ''}
      </select>
    </div>`;
  const nfsOptionsFor = (id) => {
    if (nfsAdvancedIds.has(id)) {
      return nfsState.mediaSubfolders.map(({ path, label }) => ({
        path,
        label: `${label} — ${path}`,
      }));
    }
    return nfsState.exports.map(path => {
      const label = nfsState.labels[path] || path.split('/').pop() || path;
      return { path, label: label === path ? path : `${label} — ${path}` };
    });
  };
  const fillNfsSelects = (keepValues=true) => {
    const saved = Object.fromEntries(nfsAll.map(([id]) => [id, keepValues ? $('#'+id)?.value || '' : '']));
    nfsAll.forEach(([id]) => {
      const sel = $('#'+id);
      if (!sel) return;
      const current = saved[id] || s[id] || '';
      const options = nfsOptionsFor(id);
      sel.innerHTML = '<option value="">— not used —</option>' +
        options.map(({ path, label }) => {
          const selected = path === current ? ' selected' : '';
          return `<option value="${esc(path)}"${selected}>${esc(label)}</option>`;
        }).join('');
      if (current && !options.some(opt => opt.path === current)) {
        sel.innerHTML += `<option value="${esc(current)}" selected>${esc(current)}</option>`;
      }
    });
  };
  const applySuggestions = () => {
    Object.entries(nfsState.suggestions || {}).forEach(([key, path]) => {
      const sel = $('#'+key);
      if (sel && !sel.value) sel.value = path;
    });
  };
  const renderShareList = () => {
    const box = $('#nfs-shares');
    if (!box) return;
    if (!nfsState.exports.length) {
      box.innerHTML = '<p>No shares loaded yet.</p>';
      return;
    }
    box.innerHTML = `<p>${nfsState.exports.length} share(s) on ${esc($('#NFS_SERVER').value.trim())}</p>
      <ul>${nfsState.exports.map(path => {
        const label = nfsState.labels[path] || path.split('/').pop();
        return `<li><strong>${esc(label)}</strong> <span>${esc(path)}</span></li>`;
      }).join('')}</ul>`;
  };
  const loadMediaSubfolders = async () => {
    const server = $('#NFS_SERVER').value.trim();
    const mediaPath = ($('#NFS_MEDIA')?.value || nfsState.suggestions?.NFS_MEDIA || '').trim();
    nfsState.mediaSubfolders = [];
    if (!server || !mediaPath) return;
    try {
      const q = new URLSearchParams({ server, path: mediaPath });
      const data = await api('/nfs/browse?' + q.toString());
      nfsState.mediaSubfolders = (data.entries || []).map(entry => ({
        path: entry.path,
        label: entry.name,
      }));
    } catch (_) {
      nfsState.mediaSubfolders = [];
    }
  };
  const loadNfsShares = async (applyGuess=true) => {
    const server = $('#NFS_SERVER').value.trim();
    const status = $('#nfs-shares-status');
    if (!server) {
      status.innerHTML = '<div class="banner bad">Enter the NFS server address first.</div>';
      return;
    }
    status.innerHTML = '<div class="banner" style="border:1px solid var(--line)">Loading shares…</div>';
    $('#nfs-msg').innerHTML = '';
    try {
      const data = await api('/nfs/exports?server=' + encodeURIComponent(server));
      nfsState.exports = data.exports || [];
      nfsState.labels = data.labels || {};
      nfsState.suggestions = data.suggestions || {};
      fillNfsSelects(true);
      if (applyGuess) applySuggestions();
      await loadMediaSubfolders();
      fillNfsSelects(true);
      renderShareList();
      status.innerHTML = nfsState.exports.length
        ? '<div class="banner ok">Shares loaded. Pick one for each role below, then save.</div>'
        : '<div class="banner bad">No usable shares found on that server.</div>';
    } catch (e) {
      status.innerHTML = `<div class="banner bad">${esc(e.message || 'Could not list shares')}</div>`;
      $('#nfs-shares').innerHTML = '<p>Could not load shares.</p>';
    }
  };
  render.shell(`
    <div class="section"><h2>Settings</h2><div class="card">
      <label>Domain</label><input id="KINE_DOMAIN" value="${s.KINE_DOMAIN}">
      <label>TLS Mode</label>
      <select id="KINE_TLS_MODE">
        ${['internal','acme-dns','custom'].map(m =>
          `<option ${s.KINE_TLS_MODE===m?'selected':''}>${m}</option>`).join('')}
      </select>
      <label>ACME Email (acme-dns only)</label>
      <input id="KINE_ACME_EMAIL" value="${s.KINE_ACME_EMAIL}">
      <label>ACME DNS Provider</label>
      <input id="KINE_ACME_DNS_PROVIDER" value="${s.KINE_ACME_DNS_PROVIDER}">
      <label>Timezone</label><input id="KINE_TIMEZONE" value="${s.KINE_TIMEZONE}">
      <div class="row" style="margin-top:1rem">
        <button class="act primary" id="save">Save and Reload Traefik</button>
        <button class="act" id="bk">Back Up Now</button>
      </div>
      <div id="msg"></div>
    </div></div>
    <div class="section"><h2>Media Storage</h2><div class="card">
      <p style="color:var(--muted);font-size:.85rem;margin:0 0 .75rem">
        Connect to your NFS server, pick a share for each role, and save.
        Mounts are applied automatically under <code>${s.DATA_ROOT||'/srv/media-data'}</code>.
        If TV and Movies are folders inside your media share, leave those empty.</p>
      <label>NFS Server</label>
      <div class="row" style="gap:.5rem">
        <input id="NFS_SERVER" value="${s.NFS_SERVER||''}" placeholder="10.100.30.222" style="flex:1">
        <button class="act primary" id="load-nfs-shares" type="button">Load shares</button>
      </div>
      <div id="nfs-shares-status" style="margin-top:.75rem"></div>
      <div id="nfs-shares" class="nfs-shares" style="display:none"></div>
      <div style="margin-top:1rem">
        ${nfsPrimary.map(nfsRoleRow).join('')}
      </div>
      <details style="margin-top:.75rem">
        <summary style="cursor:pointer;color:var(--muted);font-size:.85rem">
          Separate TV / Movies folders (optional)</summary>
        <p style="margin:.5rem 0;color:var(--muted);font-size:.8rem">
          Lists folders inside your media share. Leave as not used when TV and
          Movies are subfolders of the main media library mount.</p>
        <div style="margin-top:.35rem">
          ${nfsAdvanced.map(nfsRoleRow).join('')}
        </div>
      </details>
      <div class="row" style="margin-top:1rem">
        <button class="act primary" id="save-nfs">Save NFS Settings</button>
      </div>
      <div id="nfs-msg"></div>
    </div></div>
    <div class="section"><h2>Media Servers</h2><div class="card">
      <p style="color:var(--muted);font-size:.85rem;margin:0 0 .75rem">
        When configured, Sonarr and Radarr notify these servers after imports
        so libraries refresh. Leave a server blank to disable its connection.
        Domain-hosted servers (e.g. <code>emby.${esc(s.KINE_DOMAIN||'example.com')}</code>)
        are served by Traefik on <strong>port 443 with SSL</strong> — not 8096/32400.</p>
      <h3 style="margin:0 0 .35rem;font-size:.85rem">Plex</h3>
      <label>Host</label><input id="PLEX_HOST" value="${esc(s.PLEX_HOST)}" placeholder="10.100.100.20">
      <div class="row" style="gap:1rem;align-items:end">
        <div style="flex:1"><label>Port</label>
          <input id="PLEX_PORT" value="${esc(plexPort)}"></div>
        <label class="tier-switch" style="margin-bottom:.35rem" aria-label="Plex Use SSL">
          <input type="checkbox" id="PLEX_USE_SSL" ${plexSsl?'checked':''}>
          <span class="tier-switch-ui" aria-hidden="true"></span>
          <span style="margin-left:.55rem;font-size:.8rem;color:var(--muted)">Use SSL</span>
        </label>
      </div>
      <label>Token</label><input id="PLEX_TOKEN" value="${esc(s.PLEX_TOKEN)}" autocomplete="off">
      <h3 style="margin:1.25rem 0 .35rem;font-size:.85rem">Emby</h3>
      <label>Host</label><input id="EMBY_HOST" value="${esc(embyHost)}" placeholder="${esc(s.EMBY_DEFAULT_HOST||'emby.example.com')}">
      <div class="row" style="gap:1rem;align-items:end">
        <div style="flex:1"><label>Port</label>
          <input id="EMBY_PORT" value="${esc(embyPort)}"></div>
        <label class="tier-switch" style="margin-bottom:.35rem" aria-label="Emby Use SSL">
          <input type="checkbox" id="EMBY_USE_SSL" ${embySsl?'checked':''}>
          <span class="tier-switch-ui" aria-hidden="true"></span>
          <span style="margin-left:.55rem;font-size:.8rem;color:var(--muted)">Use SSL</span>
        </label>
      </div>
      <label>API Key</label><input id="EMBY_API_KEY" value="${esc(s.EMBY_API_KEY)}" autocomplete="off">
      <div class="row" style="margin-top:1rem">
        <button class="act primary" id="save-media-servers" type="button">Save Media Servers</button>
      </div>
      <div id="media-msg"></div>
    </div></div>
    <div class="section"><h2>Subtitles</h2><div class="card">
      <p style="color:var(--muted);font-size:.85rem;margin:0 0 .75rem">
        Bazarr enables Gestdown, TVSubtitles and YIFY by default, with an
        English profile that also collects <code>en:forced</code>.
        Add a free <a class="link" href="https://www.opensubtitles.com/" target="_blank" rel="noopener">OpenSubtitles.com</a>
        account for better coverage (username, not email).</p>
      <label>OpenSubtitles Username</label>
      <input id="OPENSUBTITLES_USERNAME" value="${esc(s.OPENSUBTITLES_USERNAME)}" autocomplete="username">
      <label>OpenSubtitles Password</label>
      <input id="OPENSUBTITLES_PASSWORD" type="password" value="${esc(s.OPENSUBTITLES_PASSWORD)}" autocomplete="current-password">
      <div class="row" style="margin-top:1rem">
        <button class="act primary" id="save-subtitles" type="button">Save Subtitles</button>
      </div>
      <div id="subtitles-msg"></div>
    </div></div>`);
  const sharesBox = $('#nfs-shares');
  if (sharesBox) sharesBox.style.display = 'block';
  $('#save').onclick = async () => {
    const keys = ['KINE_DOMAIN','KINE_TLS_MODE','KINE_ACME_EMAIL','KINE_ACME_DNS_PROVIDER','KINE_TIMEZONE'];
    await api('/settings', {method:'POST',
      body: JSON.stringify(Object.fromEntries(keys.map(k=>[k,$('#'+k).value])))});
    $('#msg').innerHTML = '<div class="banner ok">Saved. Certificates may take a minute.</div>';
  };
  $('#load-nfs-shares').onclick = () => loadNfsShares(true);
  $('#NFS_MEDIA')?.addEventListener('change', async () => {
    await loadMediaSubfolders();
    fillNfsSelects(true);
  });
  $('#NFS_SERVER').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); loadNfsShares(true); }
  });
  const nfsMountMessage = (result) => {
    if (!result) return '<div class="banner ok">Saved.</div>';
    const rescan = result.rescan;
    const rescanLines = (rescan?.results || [])
      .map(item => `${item.app}: ${item.ok ? item.message : item.message}`)
      .join('\n');
    const rescanBlock = rescanLines
      ? `<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${rescanLines}</pre>`
      : '';
    if (result.ok) {
      const detail = result.log ? `<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${result.log}</pre>` : '';
      const rescanTitle = rescan?.skipped ? '' : (rescan?.queued ? ' Library import started in the background (may take several minutes).' : (rescanLines ? ' Library import and rescans triggered.' : ''));
      return `<div class="banner ok">Saved and NFS mounts applied.${rescanTitle}${detail}${rescanBlock}</div>`;
    }
    const detail = result.log ? `<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${result.log}</pre>` : '';
    return `<div class="banner bad">Saved settings but mounts failed.${detail}</div>`;
  };
  $('#save-nfs').onclick = async () => {
    const keys = ['NFS_SERVER','NFS_MEDIA','NFS_TV','NFS_MOVIES','NFS_DOWNLOADS','NFS_CACHE'];
    const r = await api('/settings', {method:'POST',
      body: JSON.stringify(Object.fromEntries(keys.map(k=>[k,$('#'+k).value])))});
    $('#nfs-msg').innerHTML = nfsMountMessage(r.nfs_mount);
  };
  $('#save-media-servers').onclick = async () => {
    const msg = $('#media-msg');
    msg.innerHTML = '<div class="banner" style="border:1px solid var(--line)">Saving and wiring Sonarr/Radarr…</div>';
    const embyUseSsl = $('#EMBY_USE_SSL').checked;
    const plexUseSsl = $('#PLEX_USE_SSL').checked;
    const body = {
      PLEX_HOST: $('#PLEX_HOST').value.trim(),
      PLEX_PORT: mediaPortFor(plexUseSsl, $('#PLEX_PORT').value, 443, 32400),
      PLEX_TOKEN: $('#PLEX_TOKEN').value.trim(),
      PLEX_USE_SSL: plexUseSsl ? 'true' : 'false',
      EMBY_HOST: $('#EMBY_HOST').value.trim(),
      EMBY_PORT: mediaPortFor(embyUseSsl, $('#EMBY_PORT').value, 443, 8096),
      EMBY_API_KEY: $('#EMBY_API_KEY').value.trim(),
      EMBY_USE_SSL: embyUseSsl ? 'true' : 'false',
    };
    try {
      const r = await api('/settings', {method:'POST', body: JSON.stringify(body)});
      const log = r.media_wire?.log || '';
      const notifyFails = log.split('\n').filter(l => /notification .* failed/i.test(l));
      if (r.media_wire && !r.media_wire.ok) {
        msg.innerHTML = `<div class="banner bad">Saved, but wiring failed.<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${esc(log)}</pre></div>`;
      } else if (notifyFails.length) {
        msg.innerHTML = `<div class="banner bad">Saved with warnings — some connections could not be verified.<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${esc(notifyFails.join('\n'))}</pre></div>`;
      } else {
        msg.innerHTML = '<div class="banner ok">Saved. Sonarr and Radarr will notify these servers on new imports.</div>';
      }
    } catch (e) {
      msg.innerHTML = `<div class="banner bad">${esc(e.message || 'Could not save')}</div>`;
    }
  };
  $('#save-subtitles').onclick = async () => {
    const msg = $('#subtitles-msg');
    msg.innerHTML = '<div class="banner" style="border:1px solid var(--line)">Saving and wiring Bazarr…</div>';
    const body = {
      OPENSUBTITLES_USERNAME: $('#OPENSUBTITLES_USERNAME').value.trim(),
      OPENSUBTITLES_PASSWORD: $('#OPENSUBTITLES_PASSWORD').value,
    };
    try {
      const r = await api('/settings', {method:'POST', body: JSON.stringify(body)});
      const log = r.media_wire?.log || '';
      if (r.media_wire && !r.media_wire.ok) {
        msg.innerHTML = `<div class="banner bad">Saved, but wiring failed.<pre style="margin:.5rem 0 0;font-size:.75rem;white-space:pre-wrap">${esc(log)}</pre></div>`;
      } else {
        msg.innerHTML = '<div class="banner ok">Saved. Bazarr providers and language defaults will be applied on wire.</div>';
      }
    } catch (e) {
      msg.innerHTML = `<div class="banner bad">${esc(e.message || 'Could not save')}</div>`;
    }
  };
  bindMediaPortToggle('PLEX_USE_SSL', 'PLEX_PORT', 443, 32400);
  bindMediaPortToggle('EMBY_USE_SSL', 'EMBY_PORT', 443, 8096);
  $('#bk').onclick = async () => {
    const r = await api('/backup', {method:'POST'});
    $('#msg').innerHTML = `<div class="banner ok">Backup: ${r.path}</div>`;
  };
  if (s.NFS_SERVER) await loadNfsShares(false);
};

(async () => {
  const h = await (await fetch('/api/health')).json();
  if (!h.configured) return render.setup();
  render.apps().catch(() => render.login());
})();
</script>
</body>
</html>
