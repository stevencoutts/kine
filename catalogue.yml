# The app catalogue. Helm renders this; the provisioner uses the
# `provides` and `wires` keys to decide what to configure and in what
# order. Adding an app to the system means adding a compose fragment,
# an entry here, and (if it needs wiring) a recipe under provision/.

apps:
  emby:
    name: Emby
    tier: media
    summary: Media server. Transcodes with Intel QuickSync where available.
    url: https://emby.media
    releases: https://github.com/MediaBrowser/Emby.Releases/releases
    internal: http://emby:8096
    subdomain: emby
    provides: [library]
    # embyserver publishes a beta channel alongside latest.
    dev_tag: beta
    default: false

  tdarr:
    name: Tdarr
    tier: process
    summary: Library transcoding with a local or NFS-backed cache at /temp.
    releases: https://github.com/HaveAGitGat/Tdarr/releases
    internal: http://tdarr:8265
    subdomain: tdarr
    provides: [transcode]
    # Official images publish latest; no separate develop channel.
    default: true

  sonarr:
    name: Sonarr
    tier: acquisition
    summary: TV series management and automatic downloading.
    releases: https://github.com/Sonarr/Sonarr/releases
    internal: http://gluetun:8989
    subdomain: sonarr
    # Open inside Helm via /view/sonarr/ (same certificate as admin).
    embed: true
    api: v3
    provides: [tv-pvr]
    wires: [download-client, indexer-proxy, root-folder]
    requires: [gluetun]
    tunnelled: forced
    # linuxserver/sonarr develop tracks Sonarr's develop branch.
    dev_tag: develop
    default: true

  radarr:
    name: Radarr
    tier: acquisition
    summary: Film management and automatic downloading.
    releases: https://github.com/Radarr/Radarr/releases
    internal: http://gluetun:7878
    subdomain: radarr
    embed: true
    api: v3
    provides: [film-pvr]
    wires: [download-client, indexer-proxy, root-folder]
    requires: [gluetun]
    tunnelled: forced
    dev_tag: develop
    default: true

  prowlarr:
    name: Prowlarr
    tier: acquisition
    summary: Indexer manager. Pushes indexers to Sonarr and Radarr.
    releases: https://github.com/Prowlarr/Prowlarr/releases
    internal: http://gluetun:9696
    subdomain: prowlarr
    embed: true
    api: v1
    provides: [indexer-proxy]
    wires: [pvr-applications]
    requires: [gluetun]
    tunnelled: forced
    dev_tag: develop
    default: true

  jackett:
    name: Jackett
    tier: acquisition
    summary: Tracker indexer proxy with public indexers preconfigured.
    releases: https://github.com/Jackett/Jackett/releases
    internal: http://gluetun:9117
    subdomain: jackett
    provides: [indexer-proxy]
    requires: [gluetun]
    tunnelled: forced
    # linuxserver uses "development" (not develop) for Jackett.
    dev_tag: development
    default: false

  bazarr:
    name: Bazarr
    tier: acquisition
    summary: Subtitle management for Sonarr and Radarr libraries.
    releases: https://github.com/morpheus65535/bazarr/releases
    internal: http://gluetun:6767
    subdomain: bazarr
    embed: true
    provides: [subtitles]
    wires: [pvr-link]
    requires: [gluetun]
    tunnelled: forced
    dev_tag: development
    default: false

  transmission:
    name: Transmission
    tier: acquisition
    summary: BitTorrent client. Always tunnelled through the VPN.
    releases: https://github.com/transmission/transmission/releases
    internal: http://gluetun:9091
    subdomain: transmission
    embed: true
    provides: [download-client]
    requires: [gluetun]
    tunnelled: forced
    default: true

  nzbget:
    name: NZBGet
    tier: acquisition
    summary: Usenet downloader.
    releases: https://github.com/nzbgetcom/nzbget/releases
    internal: http://gluetun:6789
    subdomain: nzbget
    embed: true
    provides: [download-client]
    requires: [gluetun]
    tunnelled: forced
    default: false

  unpackerr:
    name: Unpackerr
    tier: acquisition
    summary: Extracts archives the *arr apps cannot import.
    releases: https://github.com/Unpackerr/unpackerr/releases
    wires: [pvr-link]
    requires: [gluetun]
    tunnelled: forced
    default: false

  recyclarr:
    name: Recyclarr
    tier: acquisition
    summary: Syncs TRaSH-guide quality profiles into Sonarr and Radarr.
    releases: https://github.com/recyclarr/recyclarr/releases
    wires: [pvr-link]
    requires: [gluetun]
    # ghcr.io/recyclarr/recyclarr edge is the continuous build channel.
    dev_tag: edge
    default: true

  seerr:
    name: Seerr
    tier: acquisition
    summary: Media request and discovery UI. Provision links Sonarr/Radarr via gluetun on kine_internal after wizard Sign In; not VPN-tunnelled.
    url: https://docs.seerr.dev
    releases: https://github.com/seerr-team/seerr/releases
    internal: http://seerr:5055
    subdomain: seerr
    provides: [requests]
    wires: [pvr-link]
    # seerr publishes a develop image alongside latest.
    dev_tag: develop
    default: false

  dispatcharr:
    name: Dispatcharr
    tier: live
    summary: IPTV, EPG, VOD and DVR manager. Proxies streams to Emby over the VPN.
    releases: https://github.com/Dispatcharr/Dispatcharr/releases
    internal: http://gluetun:9191
    subdomain: tv
    provides: [iptv]
    wires: [emby-tuner]
    requires: [gluetun]
    tunnelled: forced
    # dispatcharr publishes a floating :dev image.
    dev_tag: dev
    default: true

  ecm:
    name: Enhanced Channel Manager
    tier: live
    summary: Channel management front end for Dispatcharr.
    releases: https://github.com/MotWakorb/enhancedchannelmanager/releases
    internal: http://gluetun:6100
    subdomain: channels
    requires: [gluetun, dispatcharr]
    wires: [dispatcharr-link]
    tunnelled: forced
    dev_tag: dev
    default: true

  teamarr:
    name: Teamarr
    tier: live
    summary: Generates per-team sports EPG channels for Dispatcharr.
    releases: https://github.com/Pharaoh-Labs/teamarr/releases
    internal: http://gluetun:9195
    subdomain: sports
    requires: [gluetun, dispatcharr]
    wires: [dispatcharr-link]
    tunnelled: forced
    dev_tag: dev
    default: true

  grafana:
    name: Grafana
    tier: metrics
    summary: Dashboards for stack and application statistics. Readable without a login so Helm can embed panels.
    url: https://grafana.com/docs/grafana/latest/
    releases: https://github.com/grafana/grafana/releases
    internal: http://grafana:3000
    subdomain: grafana
    requires: [prometheus]
    default: true

  prometheus:
    name: Prometheus
    tier: metrics
    summary: Metrics store, scraped from cAdvisor, node-exporter and Helm.
    releases: https://github.com/prometheus/prometheus/releases
    internal: http://prometheus:9090
    requires: [cadvisor, node-exporter]
    default: true
    hidden: true

  cadvisor:
    name: cAdvisor
    tier: metrics
    summary: Per-container CPU, memory, network and disk statistics.
    releases: https://github.com/google/cadvisor/releases
    internal: http://cadvisor:8080
    default: true
    hidden: true

  node-exporter:
    name: Node Exporter
    tier: metrics
    summary: Host CPU, memory, disk and network statistics.
    releases: https://github.com/prometheus/node_exporter/releases
    internal: http://node-exporter:9100
    default: true
    hidden: true

  gluetun:
    name: VPN gateway
    tier: platform
    summary: WireGuard tunnel and kill switch for the whole acquisition tier.
    releases: https://github.com/qdm12/gluetun/releases
    default: true
    mandatory: true
    hidden: true
