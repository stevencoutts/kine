# Kine :: top level
#
# Each application lives in its own fragment under compose/ and declares
# a Compose profile equal to its own name. Enabling an app therefore
# means adding one word to COMPOSE_PROFILES in .env. Nothing is
# templated or generated: the repo plus .env is the whole truth, except
# compose/vpn-routing.override.yml — tracked stub; Helm writes tunnel routing
# (Traefik labels, secondaries, network_mode) to vpn-routing.generated.yml
# (gitignored). See helm/backend/app/vpn_routing.py.

name: kine

include:
  - compose/core.traefik.yml
  - compose/core.helm.yml
  - compose/core.nfs-agent.yml
  - compose/core.provision.yml
  - compose/core.mdns.yml
  - compose/vpn.gluetun.yml
  - compose/vpn-routing.override.yml
  - compose/media.emby.yml
  - compose/media.tdarr.yml
  - compose/acq.sonarr.yml
  - compose/acq.radarr.yml
  - compose/acq.prowlarr.yml
  - compose/acq.jackett.yml
  - compose/acq.bazarr.yml
  - compose/acq.transmission.yml
  - compose/acq.nzbget.yml
  - compose/acq.unpackerr.yml
  - compose/acq.recyclarr.yml
  - compose/acq.seerr.yml
  - compose/live.dispatcharr.yml
  - compose/live.ecm.yml
  - compose/live.ecm-mcp.yml
  - compose/live.game-thumbs.yml
  - compose/live.teamarr.yml
  - compose/metrics.cadvisor.yml
  - compose/metrics.node-exporter.yml
  - compose/metrics.prometheus.yml
  - compose/metrics.grafana.yml

networks:
  kine_edge:
    name: kine_edge
  kine_internal:
    name: kine_internal
  kine_ctrl:
    name: kine_ctrl
    internal: true
